<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8">
<title>Campaign Performance | American Welding Society</title>
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  * { box-sizing: border-box; }
  body { margin:0; background:#F2F3F4; font-family:Arial,"Helvetica Neue",Helvetica,sans-serif; -webkit-font-smoothing:antialiased; color:#393B3B; }
  .num { font-variant-numeric:tabular-nums; }
  .hdln { font-family:"Helvetica Neue Condensed","HelveticaNeue-CondensedBold","Arial Narrow","Helvetica Neue",Arial,sans-serif; font-stretch:condensed; }
  a { color:#0074E2; text-decoration:none; }
  a:hover { color:#003767; text-decoration:underline; }

  .wrap { min-height:100vh; padding:26px 24px 56px; display:flex; justify-content:center; }
  .col { width:1180px; max-width:100%; display:flex; flex-direction:column; gap:16px; }

  /* masthead */
  .shell { border:1px solid #E3E5E6; border-radius:6px; overflow:hidden; display:flex; flex-direction:column; }
  .mast { background:#001527; padding:19px 24px 17px; display:flex; align-items:flex-end; justify-content:space-between; gap:24px; }
  .org { font-size:10px; font-weight:700; text-transform:uppercase; letter-spacing:2.4px; color:#B6BABC; }
  .ttl { font-size:24px; font-weight:700; text-transform:uppercase; letter-spacing:0.4px; color:#fff; line-height:1.05; }
  .through { font-size:13px; font-weight:700; text-transform:uppercase; letter-spacing:1px; color:#fff; white-space:nowrap; }
  .nav { background:#fff; display:flex; padding:0 24px; flex-wrap:wrap; gap:0 26px; }
  .nav a { padding:14px 0 11px; font-size:12px; text-transform:uppercase; letter-spacing:1px; font-weight:600; color:#6E7274; border-bottom:3px solid transparent; white-space:nowrap; }
  .nav a:hover { color:#003767; border-bottom-color:#F56A00; text-decoration:none; }
  .scope { background:#FAFAFA; border-top:1px solid #EDEEEF; padding:11px 24px 12px; display:flex; align-items:flex-start; gap:0 30px; flex-wrap:wrap; row-gap:10px; }
  .sclinks { display:flex; gap:16px; align-items:center; font-size:12px; font-weight:600; }

  /* cards */
  .card { background:#fff; border:1px solid #E3E5E6; border-radius:4px; padding:16px 18px; display:flex; flex-direction:column; gap:13px; }
  .chd { display:flex; justify-content:space-between; align-items:baseline; gap:12px; flex-wrap:wrap; }
  .ctitle { font-size:12.5px; font-weight:700; text-transform:uppercase; letter-spacing:0.7px; color:#001527; white-space:nowrap; }
  .cscope { font-size:10.5px; color:#6E7274; }
  .sub { font-size:9.5px; font-weight:700; text-transform:uppercase; letter-spacing:1.1px; color:#A7ABAD; padding-top:3px; }

  /* kpi strip */
  .kpis { display:grid; grid-template-columns:repeat(auto-fit,minmax(178px,1fr)); gap:12px; }
  .kpi { background:#fff; border:1px solid #E3E5E6; border-radius:4px; padding:15px 16px; display:flex; flex-direction:column; gap:7px; }
  .kch { font-size:9px; letter-spacing:1.1px; text-transform:uppercase; color:#A7ABAD; font-weight:700; }
  .klab { font-size:10.5px; letter-spacing:0.9px; text-transform:uppercase; color:#6E7274; font-weight:700; }
  .kval { font-size:29px; font-weight:700; color:#001527; line-height:1; margin-top:auto; }
  .kpend { font-size:11px; font-weight:700; letter-spacing:0.9px; text-transform:uppercase; color:#A7ABAD; }

  /* tables */
  .tw { width:100%; overflow-x:auto; -webkit-overflow-scrolling:touch; }
  table { border-collapse:collapse; width:100%; font-size:12.5px; }
  th { text-align:left; font-size:9.5px; letter-spacing:0.7px; text-transform:uppercase; color:#6E7274; font-weight:700; padding:0 10px 7px 0; border-bottom:1px solid #E3E5E6; white-space:nowrap; }
  td { padding:9px 10px 9px 0; border-bottom:1px solid #EDEEEF; vertical-align:middle; white-space:nowrap; }
  tbody tr:last-child td { border-bottom:none; }
  td.r, th.r { text-align:right; padding-right:0; }
  th.r + th, td.r + td { padding-left:14px; }
  tr.tot td { font-weight:700; color:#001527; border-top:1.5px solid #001527; border-bottom:none; }
  .name { font-weight:600; }
  .dim { color:#6E7274; }
  .em { color:#A7ABAD; }
  .id { font-size:11px; color:#A7ABAD; }
  .note { font-size:10.5px; color:#6E7274; font-weight:400; text-transform:none; letter-spacing:0; }

  .ok { background:#E8F3EC; color:#1F8A4C; }
  .warn { background:#F3EEE1; color:#B07A00; }
  .flat { background:#F2F3F4; color:#6E7274; }
  .bad { background:#FBEDEA; color:#C0402B; }

  .rlab { font-size:9.5px; font-weight:700; text-transform:uppercase; letter-spacing:1px; color:#6E7274; }
  .rval { font-size:17px; font-weight:700; color:#001527; padding-top:3px; }

  /* share bars in channel table */
  .sbar { display:block; width:100%; min-width:110px; height:8px; background:#F2F3F4; border-radius:1px; }
  .sbar i { display:block; height:100%; background:#7FB2E8; border-radius:1px; }

  /* timeline */
  .tl { display:flex; flex-direction:column; gap:0; }
  .tlcap { display:flex; justify-content:space-between; align-items:baseline; gap:12px; padding:2px 0 7px; }
  .tlname { font-size:10px; font-weight:700; text-transform:uppercase; letter-spacing:0.9px; color:#001527; }
  .tlmax { font-size:10px; color:#6E7274; }
  .tlgrid { display:grid; gap:0 8px; }
  .tlcell { display:flex; flex-direction:column; gap:5px; }
  .band { display:flex; align-items:flex-end; }
  .bar { width:100%; border-radius:1px 1px 0 0; min-height:2px; }
  .bval { font-size:10.5px; text-align:center; color:#393B3B; }
  .ln { width:100%; height:auto; display:block; overflow:visible; }
  .tlx { display:grid; gap:0 8px; border-top:1px solid #E3E5E6; padding-top:7px; }
  .tlm { font-size:10px; font-weight:700; text-transform:uppercase; letter-spacing:0.6px; color:#6E7274; text-align:center; }
  .tlp { font-size:9px; color:#A7ABAD; text-align:center; }

  /* social gallery */
  .gal { display:grid; grid-template-columns:repeat(auto-fill,minmax(190px,1fr)); gap:12px; }
  .post { border:1px solid #E3E5E6; border-radius:3px; overflow:hidden; display:flex; flex-direction:column; }
  .thumb { position:relative; aspect-ratio:1/1; background:#F2F3F4 repeating-linear-gradient(135deg,#EDEEEF 0 6px,#F6F7F7 6px 12px); display:flex; align-items:center; justify-content:center; }
  .thumb img { width:100%; height:100%; object-fit:contain; display:block; background:#FFFFFF; }
  .thlab { font-size:9px; font-weight:700; letter-spacing:1.1px; text-transform:uppercase; color:#A7ABAD; }
  .quote { padding:14px; font-size:11.5px; line-height:1.5; color:#6E7274; align-self:center; }
  .play { position:absolute; left:50%; top:50%; transform:translate(-50%,-50%); width:34px; height:34px; border-radius:50%; background:rgba(0,21,39,0.72); color:#fff; display:flex; align-items:center; justify-content:center; font-size:12px; padding-left:3px; }
  .dur { position:absolute; right:6px; bottom:6px; background:rgba(0,21,39,0.78); color:#fff; font-size:9.5px; font-weight:700; padding:2px 5px; border-radius:2px; }
  .pmeta { padding:9px 10px 10px; display:flex; flex-direction:column; gap:7px; }
  .pplat { display:flex; justify-content:space-between; align-items:baseline; gap:8px; flex-wrap:wrap; font-size:9px; font-weight:700; text-transform:uppercase; letter-spacing:1px; color:#A7ABAD; }
  .pcap { font-size:11.5px; line-height:1.4; color:#393B3B; display:-webkit-box; -webkit-line-clamp:4; -webkit-box-orient:vertical; overflow:hidden; }
  .pfig { display:flex; flex-wrap:wrap; gap:6px 10px; border-top:1px solid #EDEEEF; padding-top:7px; }
  .pf { min-width:0; }
  .pview { font-size:10px; font-weight:700; letter-spacing:0.6px; text-transform:uppercase; }
  .pf { display:flex; flex-direction:column; gap:1px; }
  .pfl { font-size:8.5px; font-weight:700; text-transform:uppercase; letter-spacing:0.7px; color:#A7ABAD; }
  .pfv { font-size:13px; font-weight:700; color:#001527; }
  .more { align-self:flex-start; background:#fff; border:1px solid #CFD2D4; border-radius:3px; padding:8px 14px; font:inherit; font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:0.9px; color:#003767; cursor:pointer; }
  .more:hover { border-color:#003767; }
  .galsum { display:flex; gap:30px; flex-wrap:wrap; border-bottom:1px solid #EDEEEF; padding-bottom:11px; }

  .pill { display:inline-block; font-size:9.5px; font-weight:700; letter-spacing:0.5px; text-transform:uppercase; padding:3px 8px; border-radius:2px; }
  .grant { display:flex; justify-content:space-between; align-items:center; gap:12px; background:#FAFAFA; border:1px solid #EDEEEF; border-radius:3px; padding:10px 12px; }
  .grantl { font-size:10px; font-weight:700; text-transform:uppercase; letter-spacing:0.9px; color:#6E7274; }
  .grantn { font-size:10.5px; color:#A7ABAD; }
  .msp { display:grid; gap:0 8px; }
  .mspc { display:flex; flex-direction:column; gap:4px; border-left:1px solid #EDEEEF; padding:0 0 0 9px; }
  .mspm { font-size:9.5px; font-weight:700; text-transform:uppercase; letter-spacing:0.7px; color:#A7ABAD; }
  .mspv { font-size:12.5px; font-weight:600; color:#393B3B; }


  #err { display:none; background:#fff; border:1px solid #E3E5E6; border-left:3px solid #B07A00; border-radius:4px; padding:16px 18px; font-size:12.5px; }

  @media (max-width:960px) {
    .prow { grid-template-columns:118px 1fr 120px; gap:12px; }
  }
  @media (max-width:520px) {
    .wrap { padding:14px 12px 40px; }
    .ttl { font-size:19px; }
    .mast { flex-direction:column; align-items:flex-start; gap:10px; }

    .prow { grid-template-columns:1fr; gap:7px; }
    .pval { text-align:left; }
  }
</style>

</head>
<body>
<div class="wrap"><div class="col">

  <div class="shell">
    <div class="mast">
      <div style="display:flex; flex-direction:column; gap:5px;">
        <div class="org">American Welding Society</div>
        <div class="ttl hdln" id="mTitle"></div>
      </div>
      <div class="through hdln num" id="mThrough"></div>
    </div>
    <div class="nav" id="nav"></div>
    <div class="scope" id="scope"></div>
  </div>

  <div id="err">No data file loaded. This page renders from a generated <code>&lt;campaign&gt;-data.js</code> in the same directory.</div>

  <div class="kpis" id="summary"></div>
  <div id="traffic"></div>
  <div id="timeline"></div>
  <div id="paid"></div>
  <div id="email"></div>
  <div id="social"></div>
  <div id="delivery"></div>

</div></div>

<script>
(function () {
  var MONTHS = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  var DASH = '<span class="em">&mdash;</span>';

  function has(v) { return v !== null && v !== undefined && v !== ""; }
  function int(v) { return has(v) ? Math.round(v).toLocaleString("en-US") : DASH; }
  function money(v) { return has(v) ? "$" + v.toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 }) : DASH; }
  function money0(v) { return has(v) ? "$" + Math.round(v).toLocaleString("en-US") : DASH; }
  function pct(v, d) { return has(v) ? v.toFixed(d === undefined ? 1 : d) + "%" : DASH; }
  function ratio(a, b, d) { return has(a) && has(b) && b ? pct(a / b * 100, d) : DASH; }
  function per(a, b) { return has(a) && has(b) && b ? "$" + (a / b).toFixed(2) : DASH; }
  /* GA4 gives total engagement seconds; the average is seconds divided by the
     session count printed in the same row, so a reader can reproduce it. */
  function dur(sec, n) {
    if (!has(sec) || !has(n) || !n) return DASH;
    var v = Math.round(sec / n);
    if (v < 60) return v + "s";
    var m = Math.floor(v / 60), r = v % 60;
    return m + "m " + (r < 10 ? "0" : "") + r + "s";
  }
  function fmt(v, f) { return f === "money" ? money(v) : f === "money0" ? money0(v) : f === "pct" ? pct(v, 1) : f === "pct2" ? pct(v, 2) : int(v); }
  function esc(s) { return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;"); }
  function day(iso) {
    if (!has(iso)) return "";
    var p = iso.split("-");
    return MONTHS[+p[1] - 1] + " " + (+p[2]) + ", " + p[0];
  }
  function dayShort(iso) {
    if (!has(iso)) return DASH;
    var p = String(iso).split("-");
    if (p.length < 2) return String(iso);
    if (p.length === 2) return MONTHS[+p[1] - 1] + " " + p[0];
    return MONTHS[+p[1] - 1] + " " + (+p[2]);
  }
  function mlab(iso) { var p = String(iso).split("-"); return MONTHS[+p[1] - 1]; }
  function set(id, html) { document.getElementById(id).innerHTML = html; }
  function card(title, scope, body) {
    return '<div class="card"><div class="chd"><div class="ctitle hdln">' + title + '</div>' +
      (scope ? '<div class="cscope">' + scope + "</div>" : "") + "</div>" + body + "</div>";
  }
  function tbl(head, rows, foot) {
    return '<div class="tw"><table><thead><tr>' + head + "</tr></thead><tbody>" + rows + "</tbody>" +
      (foot ? "<tfoot>" + foot + "</tfoot>" : "") + "</table></div>";
  }
  function link(url, text) { return has(url) ? '<a href="' + esc(url) + '" target="_blank" rel="noopener">' + text + "</a>" : text; }

  function render() {
    var D = window.CAMPAIGN_DATA;
    if (!D) { document.getElementById("err").style.display = "block"; return; }
    var M = D.meta || {}, F = D.flags || {};
    var paid = F.hasPaid && D.paid, outcome = F.hasOutcome;

    document.title = M.campaign + " | Campaign Performance | American Welding Society";
    set("mTitle", esc(M.campaign));
    set("mThrough", "Data through " + day(M.dataThrough));

    /* nav: only sections that render */
    var secs = [];
    if (D.channels && D.channels.length) secs.push(["Traffic", "traffic"]);
    if ((D.monthly || []).length) secs.push(["Timeline", "timeline"]);
    if (paid) secs.push(["Paid Media", "paid"]);
    if ((D.email && D.email.sends || []).length) secs.push(["Email", "email"]);
    if (D.social && (D.social.posts || []).length) secs.push(["Organic Social", "social"]);
    if ((D.delivery || []).length) secs.push(["Traditional Media", "delivery"]);
    set("nav", secs.map(function (s) { return '<a href="#' + s[1] + '">' + s[0] + "</a>"; }).join(""));

    /* Header links only. The dashboard carries one date, the data-through stamp
       in the masthead. Campaign window, landing page live date and the paid
       spend cut-off were removed on 20 Aug 2026 at Roque's instruction. */
    var links = [];
    if (M.landingPage) links.push(link(M.landingPage, esc(M.landingPath || "Landing page")));
    if (M.formUrl) links.push(link(M.formUrl, "Form"));
    if (M.mondayBoard) links.push(link(M.mondayBoard, "Monday board"));
    set("scope", links.length ? '<div class="sclinks">' + links.join('<span style="color:#CFD2D4;">&#124;</span>') + "</div>" : "");
    if (!links.length) document.getElementById("scope").style.display = "none";

    /* 1. channel summary */
    set("summary", (D.summary || []).map(function (s) {
      return '<div class="kpi"><div class="kch">' + esc(s.channel) + "</div>" +
        '<div class="klab hdln">' + esc(s.label) + "</div>" +
        '<div class="kval num hdln">' + (s.pending ? '<span class="kpend">not connected</span>' : fmt(s.value, s.fmt)) + "</div></div>";
    }).join(""));

    /* 3. how people reached the page, then the conversion step */
    (function () {
      var ch = D.channels || [];
      if (!ch.length) { set("traffic", ""); return; }
      var tot = ch.reduce(function (a, c) { return { s: a.s + (c.sessions || 0), e: a.e + (c.engaged || 0), d: a.d + (c.seconds || 0) }; }, { s: 0, e: 0, d: 0 });
      var hasDur = ch.some(function (c) { return has(c.seconds); });
      var mx = Math.max.apply(null, ch.map(function (c) { return c.sessions || 0; }));
      var hasSub = ch.some(function (c) { return has(c.submissions); });
      var totSub = hasSub ? ch.reduce(function (a, c) { return a + (c.submissions || 0); }, 0) : null;
      var head = '<th>Channel</th><th class="r">Sessions</th><th class="r">Share</th><th></th>' +
        (hasDur ? '<th class="r">Avg engagement time</th>' : '<th class="r">Engaged sessions</th>') +
        '<th class="r">Engagement rate</th>' +
        (hasSub ? '<th class="r">' + esc(D.goal ? D.goal.label : "Submissions") + '</th><th class="r">Conversion rate</th>' : "");
      var rows = ch.slice().sort(function (a, b) { return b.sessions - a.sessions; }).map(function (c) {
        return '<tr><td class="name">' + esc(c.channel) + "</td>" +
          '<td class="r num">' + int(c.sessions) + "</td>" +
          '<td class="r num">' + ratio(c.sessions, tot.s) + "</td>" +
          '<td style="width:18%; padding-left:14px;"><span class="sbar"><i style="width:' + (mx ? (c.sessions / mx * 100).toFixed(1) : 0) + '%"></i></span></td>' +
          '<td class="r num">' + (hasDur ? dur(c.seconds, c.sessions) : int(c.engaged)) + "</td>" +
          '<td class="r num">' + ratio(c.engaged, c.sessions) + "</td>" +
          (hasSub ? '<td class="r num">' + int(c.submissions) + '</td><td class="r num">' + ratio(c.submissions, c.sessions, 2) + "</td>" : "") +
          "</tr>";
      }).join("");
      var foot = '<tr class="tot"><td>All sources</td><td class="r num">' + int(tot.s) + '</td><td class="r num">' + pct(100) +
        '</td><td></td><td class="r num">' + (hasDur ? dur(tot.d, tot.s) : int(tot.e)) + '</td><td class="r num">' + ratio(tot.e, tot.s) + "</td>" +
        (hasSub ? '<td class="r num">' + int(totSub) + '</td><td class="r num">' + ratio(totSub, tot.s, 2) + "</td>" : "") +
        "</tr>";

      set("traffic", card("How people reached the page",
        "landing page sessions, all sources",
        tbl(head, rows, foot)));
    })();

    /* 4. timeline */
    (function () {
      var m = D.monthly || [];
      if (!m.length) { set("timeline", ""); return; }
      var showSub = outcome && m.some(function (r) { return has(r.submissions); });
      var W = 1000, PX = 26, PY = 16;

      /* Monotone cubic interpolation. A plain Catmull-Rom spline overshoots on a series
         that jumps two orders of magnitude in a month and would draw negative sessions
         between April and May, so the tangents are clamped to preserve monotonicity. */
      function smooth(pts) {
        var n = pts.length;
        if (n < 2) return "";
        if (n === 2) return "M" + f(pts[0]) + " L" + f(pts[1]);
        var dx = [], dy = [], mSl = [];
        for (var i = 0; i < n - 1; i++) {
          dx.push(pts[i + 1].x - pts[i].x);
          dy.push(pts[i + 1].y - pts[i].y);
          mSl.push(dy[i] / (dx[i] || 1));
        }
        var t = [mSl[0]];
        for (var j = 1; j < n - 1; j++) {
          if (mSl[j - 1] * mSl[j] <= 0) { t.push(0); }
          else {
            var w1 = 2 * dx[j] + dx[j - 1], w2 = dx[j] + 2 * dx[j - 1];
            t.push((w1 + w2) / (w1 / mSl[j - 1] + w2 / mSl[j]));
          }
        }
        t.push(mSl[n - 2]);
        var d = "M" + f(pts[0]);
        for (var k = 0; k < n - 1; k++) {
          var h = dx[k];
          d += " C" + (pts[k].x + h / 3).toFixed(1) + " " + (pts[k].y + t[k] * h / 3).toFixed(1) +
               " " + (pts[k + 1].x - h / 3).toFixed(1) + " " + (pts[k + 1].y - t[k + 1] * h / 3).toFixed(1) +
               " " + f(pts[k + 1]);
        }
        return d;
        function f(p) { return p.x.toFixed(1) + " " + p.y.toFixed(1); }
      }

      function points(vals, mx, h) {
        var n = vals.length, iw = W - PX * 2, ih = h - PY * 2;
        var step = n > 1 ? iw / (n - 1) : 0;
        return vals.map(function (v, i) {
          return { x: PX + i * step, y: PY + ih - (v === null ? 0 : v / mx * ih), v: v, i: i };
        });
      }

      function single(key, color, label, h) {
        var vals = m.map(function (r) { return has(r[key]) ? r[key] : null; });
        var mx = Math.max.apply(null, vals.map(function (v) { return v || 0; })) || 1;
        var pts = points(vals, mx, h).filter(function (p) { return p.v !== null; });
        var d = smooth(pts);
        var ih = h - PY * 2;
        var area = d ? d + " L" + pts[pts.length - 1].x.toFixed(1) + " " + (PY + ih) +
                       " L" + pts[0].x.toFixed(1) + " " + (PY + ih) + " Z" : "";
        return '<div class="tlcap"><div class="tlname hdln">' + esc(label) +
          '</div><div class="tlmax num">peak ' + int(mx) + "</div></div>" +
          '<svg class="ln" viewBox="0 0 ' + W + " " + h + '" preserveAspectRatio="none" role="img">' +
          grid(h) +
          (area ? '<path d="' + area + '" fill="' + color + '" fill-opacity="0.10"/>' : "") +
          (d ? '<path d="' + d + '" fill="none" stroke="' + color + '" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>' : "") +
          pts.map(function (p) {
            return '<circle cx="' + p.x.toFixed(1) + '" cy="' + p.y.toFixed(1) + '" r="3.5" fill="#fff" stroke="' +
              color + '" stroke-width="2"' + (m[p.i].partial ? ' stroke-dasharray="2 2"' : "") + "/>";
          }).join("") +
          pts.map(function (p) {
            var a = p.x < PX + 30 ? "start" : p.x > W - PX - 30 ? "end" : "middle";
            return '<text x="' + p.x.toFixed(1) + '" y="' + Math.max(11, p.y - 9).toFixed(1) +
              '" text-anchor="' + a + '" font-size="11" font-family="Arial,Helvetica,sans-serif" fill="#393B3B">' +
              int(p.v) + "</text>";
          }).join("") + "</svg>";
      }

      function grid(h) {
        var ih = h - PY * 2;
        return [0, 0.5, 1].map(function (fr) {
          var y = PY + ih * fr;
          return '<line x1="' + PX + '" x2="' + (W - PX) + '" y1="' + y + '" y2="' + y +
                 '" stroke="#EDEEEF" stroke-width="1"/>';
        }).join("");
      }

      var cols = "grid-template-columns:repeat(" + m.length + ",minmax(0,1fr));";
      var body = '<div class="tl">' + single("sessions", "#0074E2", "Landing page sessions", 150);
      if (showSub) body += '<div style="height:14px;"></div>' +
        single("submissions", "#003767", D.goal ? D.goal.label : "Submissions", 118);
      body += '<div class="tlx" style="' + cols + '">' + m.map(function (r) {
        return '<div><div class="tlm hdln">' + mlab(r.m) + '</div>' +
          (r.partial ? '<div class="tlp">to ' + dayShort(M.dataThrough) + "</div>" : "") + "</div>";
      }).join("") + "</div></div>";
      set("timeline", card("Timeline", "monthly", body));
    })();

    /* 5. paid media */
    (function () {
      if (!paid) { set("paid", ""); return; }
      var P = D.paid, pl = P.platforms || [], pt = P.placements || [];

      function tot(list) {
        return list.reduce(function (a, r) {
          return { spend: a.spend + (r.spend || 0),
                   clicks: a.clicks + (r.clicks || 0),
                   imp: has(r.impressions) ? a.imp + r.impressions : a.imp,
                   impN: has(r.impressions) ? a.impN + 1 : a.impN,
                   sess: has(r.sessions) ? a.sess + r.sessions : a.sess,
                   sessN: has(r.sessions) ? a.sessN + 1 : a.sessN };
        }, { spend: 0, clicks: 0, imp: 0, impN: 0, sess: 0, sessN: 0 });
      }
      /* A total is only shown when every row contributed to it. A partial sum under a
         complete-looking heading is the same failure as an invented figure. */
      function rollup(list) {
        var t = tot(list);
        return { spend: t.spend, clicks: t.clicks,
                 impressions: t.impN === list.length ? t.imp : null,
                 sessions: t.sessN === list.length ? t.sess : null };
      }

      /* Sessions are decided per table, not once for the card. The platform table
         allocates sessions by analytics source, which is exact. The placement table
         would need a campaign name join, which is the one fragile join on the page,
         so it carries the buy only: spend, impressions and clicks. */
      function hasSess(list) { return list.some(function (r) { return has(r.sessions); }); }
      /* A video buy is not bought on clicks. Showing its cost per click without its
         views reads as catastrophic inefficiency and would drive the wrong decision,
         so where a row reports views the column appears and stays blank elsewhere. */
      function hasViews(list) { return list.some(function (r) { return has(r.views); }); }
      function head(ss, vw) {
        return '<th class="r">Spend</th><th class="r">Impressions</th>' +
               (vw ? '<th class="r">Video views</th>' : "") +
               '<th class="r">Landing page clicks</th><th class="r">Click rate</th>' +
               '<th class="r">Cost / click</th>' +
               (ss ? '<th class="r">Sessions</th><th class="r">Click to session</th><th class="r">Cost / session</th>' : "");
      }
      function cells(r, ss, vw) {
        return '<td class="r num">' + money(r.spend) + "</td>" +
               '<td class="r num">' + int(r.impressions) + "</td>" +
               (vw ? '<td class="r num">' + int(r.views) + "</td>" : "") +
               '<td class="r num">' + int(r.clicks) + "</td>" +
               '<td class="r num">' + ratio(r.clicks, r.impressions, 2) + "</td>" +
               '<td class="r num">' + per(r.spend, r.clicks) + "</td>" +
               (ss ? '<td class="r num">' + int(r.sessions) + "</td>" +
                     '<td class="r num">' + ratio(r.sessions, r.clicks, 1) + "</td>" +
                     '<td class="r num">' + per(r.spend, r.sessions) + "</td>" : "");
      }

      var plSess = hasSess(pl), plView = hasViews(pl);
      var tp = rollup(pl);
      var plRows = pl.map(function (r) {
        return '<tr><td class="name">' + esc(r.platform) + "</td>" + cells(r, plSess, plView) + "</tr>";
      }).join("");
      var plFoot = '<tr class="tot"><td>All platforms</td>' + cells(tp, plSess, plView) + "</tr>";

      /* By placement type. A campaign name means nothing to a reader; the buy type does. */
      var ptBlock = "";
      if (pt.length) {
        var ptSess = hasSess(pt), ptView = hasViews(pt);
        var tc = rollup(pt);
        var ptRows = pt.slice().sort(function (a, b) { return b.spend - a.spend; }).map(function (r) {
          return '<tr><td class="name">' + esc(r.placement) + '</td><td class="dim">' + esc(r.platforms || "") + "</td>" +
            cells(r, ptSess, ptView) + "</tr>";
        }).join("");
        var ptFoot = '<tr class="tot"><td>All placements</td><td></td>' + cells(tc, ptSess, ptView) + "</tr>";
        ptBlock = '<div class="sub hdln">By placement type</div>' +
          tbl('<th>Placement</th><th>Platform</th>' + head(ptSess, ptView), ptRows, ptFoot);
      }

      set("paid", card("Paid media", "paid channels only",
        '<div class="sub hdln">By platform</div>' +
        tbl('<th>Platform</th>' + head(plSess, plView), plRows, plFoot) +
        ptBlock));
    })();

    /* 6. email */
    (function () {
      var s = (D.email && D.email.sends) || [];
      if (!s.length) { set("email", ""); return; }
      var t = s.reduce(function (a, r) {
        return { d: a.d + (r.delivered || 0), o: a.o + (r.opens || 0), c: a.c + (r.clicks || 0), u: a.u + (r.unsubs || 0),
                 n: a.n + (has(r.delivered) ? 1 : 0) };
      }, { d: 0, o: 0, c: 0, u: 0, n: 0 });
      var rows = s.map(function (r) {
        var subj = has(r.subject) ? link(r.url, esc(r.subject))
                 : '<span class="dim">Scheduled for ' + esc(r.scheduled || "TBD") + "</span>";
        return '<tr><td class="name">' + subj + "</td>" +
          '<td class="dim num">' + dayShort(r.sent) + "</td>" +
          '<td class="r num">' + int(r.delivered) + "</td>" +
          '<td class="r num">' + int(r.opens) + "</td>" +
          '<td class="r num">' + ratio(r.opens, r.delivered, 2) + "</td>" +
          '<td class="r num">' + int(r.clicks) + "</td>" +
          '<td class="r num">' + ratio(r.clicks, r.delivered, 2) + "</td>" +
          '<td class="r num">' + int(r.unsubs) + "</td>" +
          '<td class="r num">' + ratio(r.unsubs, r.delivered, 2) + "</td></tr>";
      }).join("");
      var foot = '<tr class="tot"><td>All sends</td><td></td>' +
        '<td class="r num">' + int(t.d) + '</td><td class="r num">' + int(t.o) + '</td><td class="r num">' + ratio(t.o, t.d, 2) +
        '</td><td class="r num">' + int(t.c) + '</td><td class="r num">' + ratio(t.c, t.d, 2) +
        '</td><td class="r num">' + int(t.u) + '</td><td class="r num">' + ratio(t.u, t.d, 2) + "</td></tr>";
      set("email", card("Email", s.length + " sends planned, " + t.n + " sent",
        tbl('<th>Subject</th><th>Sent</th><th class="r">Delivered</th><th class="r">Opens</th><th class="r">Open rate</th><th class="r">Clicks</th><th class="r">Click rate</th><th class="r">Unsubs</th><th class="r">Unsub rate</th>', rows, foot)));
    })();

    /* 7. organic social */
    (function () {
      var posts = (D.social && D.social.posts) || [];
      if (!posts.length) { set("social", ""); return; }
      var CAP = 10;
      /* A total is only shown when every post contributed to it. Facebook impressions are
         not available today, so summing what exists would publish a total that silently
         covers one post in four. */
      /* Every post now carries a delivery figure, so the total is a real total.
         LinkedIn calls it impressions and Meta calls it views; both count times
         the content was put in front of someone, which is why the heading names
         both rather than picking one and quietly covering the other. */
      function complete(list, fn) {
        var n = 0, s = 0;
        list.forEach(function (p) { var v = fn(p); if (has(v)) { n++; s += v; } });
        return (list.length && n === list.length) ? s : null;
      }
      var seenTot = complete(posts, dval);
      var engTot = complete(posts, function (p) { return p.engagements; });
      /* LinkedIn reports impressions, Instagram reports views, Facebook reports
         neither: every metric in the post_impressions family is withdrawn. The
         cell is left empty rather than filled from a different basis. */
      function dlab(p) { return has(p.impressions) ? "Impressions" : has(p.views) ? "Views" : "Impressions"; }
      function dval(p) { return has(p.impressions) ? p.impressions : has(p.views) ? p.views : null; }

      function tile(p) {
        var thumb;
        if (has(p.image)) thumb = '<div class="thumb"><img src="' + esc(p.image) + '" alt="" loading="lazy"></div>';
        else if (p.mediaType === "video") thumb = '<div class="thumb"><div class="play">&#9654;</div>' + (p.duration ? '<div class="dur num">' + esc(p.duration) + "</div>" : "") + "</div>";
        else thumb = '<div class="thumb" style="background:#FAFAFA;"><div class="quote">&ldquo;' + esc(p.caption) + "&rdquo;</div></div>";
        return '<div class="post">' + thumb + '<div class="pmeta">' +
          '<div class="pplat"><span>' + esc(p.platform) + '</span><span class="num">' + dayShort(p.date) +
          (has(p.url) ? '</span><a class="pview" href="' + esc(p.url) + '" target="_blank" rel="noopener">View</a>' : "</span>") + "</div>" +
          '<div class="pcap">' + esc(p.caption) + "</div>" +
          '<div class="pfig"><div class="pf"><div class="pfl">' + dlab(p) + '</div><div class="pfv num">' +
            int(dval(p)) + "</div></div>" +
          '<div class="pf"><div class="pfl">Engagements</div><div class="pfv num">' + int(p.engagements) + "</div></div>" +
          "</div></div></div>";
      }
      var body = '<div class="galsum">' +
        sum("Posts published", int(posts.length)) +
        sum("Impressions and views", int(seenTot)) +
        sum("Engagements", int(engTot)) +
        sum("Engagement rate", ratio(engTot, seenTot, 2)) + "</div>" +
        '<div class="gal" id="gal">' + posts.slice(0, CAP).map(tile).join("") + "</div>" +
        (posts.length > CAP ? '<button class="more" id="galMore">Show all ' + posts.length + " posts</button>" : "");
      set("social", card("Organic social", (D.social.mockup ? "mockup, data not connected; figures are placeholders" : "platform reported"), body));
      var btn = document.getElementById("galMore");
      if (btn) btn.onclick = function () {
        document.getElementById("gal").innerHTML = posts.map(tile).join("");
        btn.parentNode.removeChild(btn);
      };
      function sum(l, v) { return '<div class="pf"><div class="rlab">' + l + '</div><div class="rval num">' + v + "</div></div>"; }
    })();

    /* 8. traditional media */
    (function () {
      var d = D.delivery || [];
      if (!d.length) { set("delivery", ""); return; }
      /* Three states only. Project-board vocabulary such as Stuck or Working on it does not
         belong on a performance report; it describes the board, not the delivery. */
      function state(v) {
        var t = String(v || "").toLowerCase();
        if (/done|deliver|publish|sent|live|complete/.test(t)) return "Done";
        if (/progress|stuck|review|draft|schedul|working/.test(t)) return "In progress";
        return "Not started";
      }
      var done = d.filter(function (r) { return state(r.status) === "Done"; }).length;
      set("delivery", card("Traditional media", done + " of " + d.length + " published",
        tbl('<th>Channel</th><th>Item</th><th>Date</th><th>Status</th><th>Tracking</th>',
          d.map(function (r) {
            var st = state(r.status);
            var cls = st === "Done" ? "ok" : st === "In progress" ? "warn" : "flat";
            var tr = "";
            if (r.vanity) {
              tr = '<a href="' + esc(r.vanityUrl || "#") + '" target="_blank" rel="noopener">' + esc(r.vanity) + "</a>";
              if (has(r.clicks)) tr += ' <span class="dim num">' + int(r.clicks) + " clicks</span>";
              if (has(r.sessions)) tr += ' <span class="dim num">&middot; ' + int(r.sessions) + " sessions</span>";
            } else {
              tr = '<span class="dim">not trackable</span>';
            }
            return '<tr><td class="dim">' + esc(r.channel) + '</td><td class="name">' + esc(r.item) + "</td>" +
              '<td class="num">' + dayShort(r.due) + '</td><td><span class="pill ' + cls + '">' + st + "</span></td>" +
              "<td>" + tr + "</td></tr>";
          }).join(""))));
    })();
  }

  window.__renderCampaign = render;
  /* data file loads after this script; see the loader at the end of the document */
})();
</script>

<script src="fowc-data.js"></script>
<script>window.__renderCampaign();</script>


</body></html>
