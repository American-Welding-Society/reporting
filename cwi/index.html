<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8">
<title>CWI Promotion | American Welding Society</title>
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
  /* CWI promotion dashboard. Built on campaign dashboard template v2: same tokens, cards,
     tables, tiles and galleries. Additions for an always-on program: a period selector with
     previous-period comparisons, what sold, the CWI pages, the email series, texts, This Week
     in Welding, the top posts across platforms, and publications. The shell contains no numbers: every figure comes from
     campaign-data.js, and a section renders only when its data exists. */
  :root {
    --navy:#001527;        /* the navy field, as the real sends use it */
    --deep:#0A1628;        /* dark band and strong label */
    --blue:#0074E2;        /* links and the marketing bar */
    --orange:#F56A00;      /* the one accent: eyebrows, the active period, the rank chip */
    --orange-soft:#FF8C32;
    --ink:#393B3B; --mid:#727575; --faint:#ABACAC;   /* --faint is for rules and bar tracks, never for text */
    --label:#5F6466;       /* every small label: 6.0 to 1 on white, 5.75 on the striped row */
    --up-ink:#1A7742;      /* the green that carries a figure */
    --line:#E5E5E5; --hair:#EDEDED; --wash:#FAFAFA; --page:#E5E5E5;
    --up:#1F8A4C; --down:#C0392B; --hold:#B07A00;
    --other:#C9CED1; --sky:#8DB9E9; --amber:#F7A865;
    --p-google:#0074E2; --p-microsoft:#00A3AD; --p-meta:#0A1628; --p-linkedin:#7FA7D6;
    --p-reddit:#6B5B95; --p-spotify:#9A6B00;
    --lift:0 1px 2px rgba(0,21,39,0.05), 0 12px 28px -22px rgba(0,21,39,0.45);
  }
  * { box-sizing:border-box; }
  html { scroll-behavior:smooth; }
  body { margin:0; background:var(--page); color:var(--ink);
    font-family:system-ui,-apple-system,"Segoe UI","Helvetica Neue",Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased; font-size:13.5px; line-height:1.5; }
  body.noscroll { overflow:hidden; }
  .num { font-variant-numeric:tabular-nums; font-feature-settings:"tnum" 1; }
  /* Arial Narrow first: it ships on Windows and macOS, so the page is the same on both. The two names
     that resolved to nothing are gone (design audit, 17 September 2026). */
  .hdln { font-family:"Arial Narrow",Arial,Helvetica,sans-serif; letter-spacing:0.2px; }
  a { color:var(--blue); text-decoration:none; }
  a:hover { color:var(--deep); text-decoration:underline; }
  a:focus-visible, th:focus-visible, button:focus-visible, select:focus-visible, .tw:focus-visible { outline:2px solid var(--orange); outline-offset:2px; }
  @media (prefers-reduced-motion: reduce) { html { scroll-behavior:auto; } }

  .wrap { min-height:100vh; padding:30px 24px 80px; display:flex; justify-content:center; }
  .col { width:1180px; max-width:100%; display:flex; flex-direction:column; gap:22px; }

  /* masthead */
  .shell { border-radius:12px; overflow:hidden; box-shadow:var(--lift); }
  .mast { background:linear-gradient(160deg,#0A2136 0%,var(--navy) 65%); padding:30px 30px 26px; display:flex;
    align-items:flex-end; justify-content:space-between; gap:28px; border-top:3px solid var(--orange); }
  .org { font-size:10px; font-weight:700; text-transform:uppercase; letter-spacing:2.6px; color:#8FA0AE; }
  .ttl { font-size:38px; font-weight:700; text-transform:uppercase; letter-spacing:0.2px; color:#fff; line-height:1.02; margin-top:8px; text-wrap:balance; }
  .through { font-size:10.5px; font-weight:700; text-transform:uppercase; letter-spacing:1.4px; color:#CBD4DA;
    white-space:nowrap; border:1px solid rgba(255,255,255,0.22); border-radius:999px; padding:7px 13px; }

  .navbar { position:sticky; top:0; z-index:30; background:#fff; border-radius:10px; box-shadow:var(--lift); }
  .nav { display:flex; padding:0 22px; flex-wrap:wrap; gap:0 18px; }
  .nav a { padding:14px 0 11px; font-size:11px; text-transform:uppercase; letter-spacing:0.7px;
    font-weight:700; color:var(--mid); border-bottom:2px solid transparent; white-space:nowrap; }
  .nav a:hover { color:var(--navy); text-decoration:none; border-bottom-color:#CBD2D6; }
  .nav a.on { color:var(--navy); border-bottom-color:var(--orange); }
  .navbar { display:flex; align-items:center; gap:0; }
  .navbar > .nav { flex:1 1 auto; min-width:0; flex-wrap:nowrap; overflow-x:auto; scrollbar-width:none;
    -webkit-mask-image:linear-gradient(to right,#000 calc(100% - 28px),transparent);
    mask-image:linear-gradient(to right,#000 calc(100% - 28px),transparent); }
  .navbar > .nav::-webkit-scrollbar { display:none; }
  .navbar > .nav { scroll-padding-inline:0 32px; }
  .navbar > .nav::after { content:""; flex:0 0 28px; }
  .nav a { white-space:nowrap; }
  .navnow { order:-1; flex:0 0 auto; padding:0 16px 0 22px; font-size:10.5px; font-weight:700; letter-spacing:0.4px;
    text-transform:uppercase; color:var(--label); white-space:nowrap; }
  .navnow { display:none; }
  .navbar.past .navnow { display:block; }
  @media (max-width:1200px) { .navbar.past .navnow { display:none; } }
  @media (max-width:1100px) and (min-width:961px) { .strip .sil { min-height:30px; } }
  @media (max-width:960px) and (min-width:521px) { .kpi .ksub { min-height:32px; } }
  @media (max-width:1100px) and (min-width:961px) { .nav { gap:0 13px; } .nav a { letter-spacing:0.3px; } }
  html { scroll-padding-top:56px; }
  .col > div[id] { scroll-margin-top:40px; }

  /* cards: white, lifted, no outline, so the page is read by weight and space rather than by rules */
  .card { background:#fff; border-radius:12px; padding:0 24px 24px; display:flex; flex-direction:column; gap:18px;
    box-shadow:var(--lift); }
  .chd { display:flex; justify-content:space-between; align-items:center; gap:14px 18px; flex-wrap:wrap;
    margin:0 -24px; padding:20px 24px 4px; }
  .ctitle { font-size:19px; font-weight:700; text-transform:uppercase; letter-spacing:0.6px; color:var(--navy);
    white-space:nowrap; flex:0 0 auto; line-height:1.1; }
  .cscope { font-size:12px; color:var(--mid); line-height:1.6; max-width:none; text-wrap:pretty; }
  .cscope.below { max-width:none; margin-top:-6px; }
  sup.fn { font-size:9px; font-weight:700; color:var(--label); margin-left:2px; letter-spacing:0; vertical-align:0.35em; line-height:0; }
  ol.fnotes { margin:0; padding:10px 0 0 18px; border-top:1px solid var(--hair); font-size:12px; color:var(--mid); line-height:1.6;
    display:flex; flex-direction:column; gap:4px; }
  ol.fnotes li::marker { font-size:10px; font-weight:700; color:var(--label); }
  .sub { font-size:13px; font-weight:700; text-transform:uppercase; letter-spacing:0.5px; color:var(--deep);
    display:flex; align-items:center; gap:9px; }
  .sub::before { content:""; flex:0 0 16px; height:2px; background:var(--orange); }
  .herolabel { padding:2px 0; margin-bottom:-12px; }
  .sub .subn { font-size:12px; font-weight:600; text-transform:none; letter-spacing:0; color:var(--label); }

  /* the period selector */
  .period { background:#fff; padding:14px 30px 16px; display:flex; flex-direction:column; gap:10px; border-top:1px solid var(--hair); }
  .pbar { display:flex; flex-wrap:wrap; align-items:center; gap:10px 16px; }
  .plab { font-size:9.5px; font-weight:700; letter-spacing:1.3px; text-transform:uppercase; color:var(--label); }
  .presets { display:flex; flex-wrap:wrap; gap:6px; }
  .presets button, .seg button { font:inherit; font-size:11.5px; font-weight:600; color:var(--deep); background:var(--wash);
    border:1px solid transparent; border-radius:999px; padding:5px 13px; cursor:pointer; white-space:nowrap; transition:background .12s, color .12s; }
  .presets button:hover, .seg button:hover { background:#E8EDF1; }
  .presets button[aria-pressed="true"], .seg button[aria-pressed="true"] { background:var(--navy); color:#fff; }
  .custom { display:flex; flex-wrap:wrap; gap:10px; margin-left:auto; }
  .custom label { font-size:11.5px; font-weight:600; color:var(--mid); display:flex; align-items:center; gap:6px; }
  .custom select { font:inherit; font-size:11.5px; color:var(--navy); border:1px solid var(--line); border-radius:6px; padding:4px 7px; background:#fff; }
  .pnow { display:flex; flex-wrap:wrap; align-items:baseline; gap:4px 12px; font-size:12px; color:var(--mid); }
  .pnow b { color:var(--navy); font-size:13.5px; }
  .seg { display:inline-flex; gap:6px; flex-wrap:wrap; }

  /* headline tiles */
  .kpis { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:18px; }
  .kpi { background:#fff; border-radius:12px; padding:20px 22px 22px; display:flex; flex-direction:column; gap:6px;
    min-height:150px; box-shadow:var(--lift); position:relative; overflow:hidden; }
  .kpi::before { content:""; position:absolute; left:0; top:0; bottom:0; width:3px; background:var(--navy); opacity:0.12; }
  .kpi:first-child::before { background:var(--orange); opacity:1; }
  .klab { font-size:11.5px; color:var(--mid); font-weight:600; line-height:1.4; letter-spacing:0.2px; }
  .ksub { font-size:11px; color:var(--label); line-height:1.45; }
  .kval { font-size:42px; font-weight:700; color:var(--navy); line-height:1; margin-top:auto; padding-top:12px; letter-spacing:-0.8px; }
  .kcmp { font-size:11.5px; color:var(--mid); padding-top:2px; }
  .cmp b { font-weight:700; }
  .cu { color:var(--up-ink); } .cd { color:var(--down); } .cf { color:var(--mid); }

  /* the whole-campaign strip under the tiles */
  .card.strip { flex-direction:row; flex-wrap:wrap; gap:0; align-items:stretch; padding:0; }
  .strip .si { padding:14px 24px; display:flex; flex-direction:column; gap:2px; flex:1 1 auto; white-space:nowrap; }
  .strip .si.head { background:var(--navy); border-radius:12px 0 0 12px; justify-content:center; flex:0 0 auto; }
  .strip .si.head .sil { color:#fff; }
  .strip .sil { font-size:10px; font-weight:700; text-transform:uppercase; letter-spacing:1.1px; color:var(--label); }
  .strip .siv { font-size:22px; font-weight:700; color:var(--navy); line-height:1.15; }
  .strip .sis { font-size:11px; color:var(--label); }
  .strip .sil, .strip .sis { white-space:normal; }
  .sic { font-size:11px; color:var(--mid); }
  #kpis2 { display:grid; grid-template-columns:minmax(150px,auto) repeat(4,minmax(0,1fr)); }

  /* tables: one rule under the head, nothing between rows */
  .tw { width:100%; overflow-x:auto; -webkit-overflow-scrolling:touch; }
  .tw.scrolls:not(.end) { -webkit-mask-image:linear-gradient(to right,#000 calc(100% - 26px),transparent);
    mask-image:linear-gradient(to right,#000 calc(100% - 26px),transparent); }
  table { border-collapse:separate; border-spacing:0; width:100%; font-size:13px; }
  table.sortable th { cursor:pointer; user-select:none; position:relative; }
  table.sortable th::after { content:"\2195"; margin-left:3px; color:transparent; font-size:9px; position:absolute; }
  table.sortable th:hover { color:var(--navy); }
  table.sortable th:hover::after { color:#C6CBCE; }
  .tw.scrolls:focus-visible, .tw.scrolls:has(:focus-visible) { -webkit-mask-image:none; mask-image:none; }  /* a keyboard-focused table shows its ring whole */
  table.sortable th:focus-visible { outline-offset:-2px; background:#fff; }
  table.sortable th:focus-visible:not(:first-child) { outline:none; z-index:3; box-shadow:-4px 0 0 #fff; }
  table.sortable th:focus-visible:not(:first-child)::before { content:""; position:absolute; inset:0 0 0 -6px; border:2px solid var(--orange);
    pointer-events:none; }
  .navbar > .nav a { padding-left:4px; padding-right:4px; margin:0 -4px; }  /* inside the head, so neither the scroller nor the next head hides it */
  table.sortable th[data-nosort]:hover { color:var(--label); }
  table.sortable th[data-nosort]::after { content:none; }
  table.sortable th.sorted { color:var(--navy); }
  table.sortable th.sorted::after { color:var(--blue); }
  table.sortable th.sorted[data-dir="asc"]::after { content:"\2191"; }
  table.sortable th.sorted[data-dir="desc"]::after { content:"\2193"; }
  th { text-align:left; font-size:9.5px; letter-spacing:1px; text-transform:uppercase; color:var(--label);
    font-weight:700; padding:9px 14px 9px 0; background:var(--wash); white-space:nowrap; }
  th:first-child { padding-left:14px; border-radius:7px 0 0 7px; }
  th:last-child { border-radius:0 7px 7px 0; }
  td { padding:11px 14px 11px 0; vertical-align:middle; white-space:nowrap; }
  td:first-child { padding-left:14px; }
  tbody tr:nth-child(even) td { background:var(--wash); }
  tbody tr:hover td { background:#F1F5F8; }
  td.wrapcell { white-space:normal; min-width:220px; max-width:440px; }
  @media (min-width:521px) { #publications td.name { white-space:normal; min-width:260px; } }
  td.r, th.r { text-align:right; }
  tr.tot td { font-weight:700; color:var(--navy); border-top:2px solid var(--navy); background:#fff;
    padding-top:12px; padding-bottom:12px; }
  tr.tot:hover td, tbody tr.tot:nth-child(even) td { background:#fff; }
  tr.subt td { font-weight:700; color:var(--navy); border-top:1px solid var(--line); background:#fff; }
  tbody tr.subt:nth-child(even) td, tr.subt:hover td { background:#fff; }
  tr.grp td, tr.grp:hover td, tbody tr.grp:nth-child(even) td { background:#fff; color:var(--navy); font-size:10px; font-weight:700;
    text-transform:uppercase; letter-spacing:1.4px; padding:18px 14px 6px; }
  tbody tr:first-child.grp td { padding-top:10px; }
  .name { font-weight:600; color:var(--navy); }
  .dim { color:var(--label); font-weight:400; }
  .raw { display:block; font-size:10.5px; color:var(--label); font-weight:400; margin-top:2px; white-space:normal; }
  .raw.phoneonly { display:none; }
  /* the reconciling line under a paid source sits on one line, so the row keeps its height */
  #sources td:first-child { min-width:240px; }
  #sources td:first-child .raw { white-space:nowrap; }
  .unit { display:block; font-size:9.5px; color:var(--label); text-transform:uppercase; letter-spacing:0.7px; font-weight:600; }
  .up { color:var(--up-ink); font-weight:700; }
  .down { color:var(--down); font-weight:700; }
  .note { font-size:11.5px; line-height:1.6; color:var(--label); font-weight:400; text-wrap:pretty; }
  .callout { display:block; background:var(--wash); border-radius:8px; padding:12px 14px; }
  .pill { display:inline-block; font-size:10.5px; font-weight:700; letter-spacing:0.6px; text-transform:uppercase;
    border-radius:999px; padding:3px 9px; border:1px solid currentColor; }
  .ok { background:#E7F3EC; color:#14663A; }
  .warn { background:#F6EFDF; color:#7A5500; }
  .flat { background:#EFF1F2; color:#4E5354; }
  .tag { display:inline-block; font-size:9px; font-weight:700; letter-spacing:0.7px; text-transform:uppercase;
    border-radius:999px; padding:3px 8px; background:#E7F1FC; color:var(--deep); margin-right:6px; }
  .tag.lead { background:#FDEBDD; color:#A8490A; }
  .twi { display:block; }
  .twi + .twi { margin-top:4px; }
  .swatch { display:inline-block; width:9px; height:9px; border-radius:3px; margin-right:8px; }

  /* share bars in the traffic table */
  td.barcell { width:12%; padding-left:14px; }
  .sbar { display:block; width:100%; min-width:96px; height:6px; background:transparent; border-radius:3px; }
  .sbar i { display:block; height:100%; background:var(--sky); border-radius:3px; }
  .sbar.mk i { background:var(--blue); }

  /* summary tiles above a table */
  .galsum { display:grid; grid-template-columns:repeat(auto-fill,minmax(180px,1fr)); gap:12px; }
  .gs { padding:14px 16px; background:var(--wash); border-radius:10px; display:flex; flex-direction:column;
    justify-content:space-between; gap:6px; }
  .gs .l { min-height:24px; }
  .gs .v.zero { color:var(--label); font-weight:600; }
  .gs .l { font-size:9.5px; font-weight:700; text-transform:uppercase; letter-spacing:1.1px; color:var(--label); }
  .gs .v { font-size:clamp(17px,1.9vw,23px); font-weight:700; color:var(--navy); padding-top:4px; line-height:1.15;
    white-space:nowrap; }

  /* galleries: top posts and publications */
  .gal { display:grid; grid-template-columns:repeat(auto-fill,minmax(250px,1fr)); gap:16px; }
  .post { border-radius:10px; overflow:hidden; display:flex; flex-direction:column; background:#fff;
    box-shadow:0 1px 2px rgba(0,21,39,0.06); transition:transform .14s, box-shadow .14s; }
  .post:hover { transform:translateY(-2px); box-shadow:0 6px 18px -8px rgba(0,21,39,0.35); }
  .thumb { position:relative; aspect-ratio:1/1; background:var(--wash); display:flex; align-items:center; justify-content:center; }
  .thumb img { width:100%; height:100%; object-fit:contain; display:block; }
  .thumb.text { aspect-ratio:auto; min-height:120px; background:var(--wash); }
  .pmeta { padding:13px 14px 15px; display:flex; flex-direction:column; gap:9px; flex:1; }
  .pplat { display:flex; justify-content:space-between; align-items:baseline; gap:4px 8px; flex-wrap:wrap;
    font-size:10px; font-weight:700; text-transform:uppercase; letter-spacing:1px; color:var(--label); }
  .adname { font-size:13px; font-weight:700; color:var(--navy); line-height:1.35; text-wrap:pretty; }

  /* top posts */
  .top4 { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:16px; }
  a.toppost { color:inherit; text-decoration:none; }
  a.toppost:focus-visible { outline:2px solid var(--orange); outline-offset:2px; }
  .toppost .thumb, .toppost .thumb.text { aspect-ratio:1/1; overflow:hidden; background:var(--navy); min-height:0; }
  .toppost .thumb img { position:absolute; inset:0; width:100%; height:100%; object-fit:contain; background:var(--navy); }
  .qcard { position:absolute; inset:0; padding:18px; display:flex; flex-direction:column; justify-content:flex-end; }
  .toppost .thumb { container-type:inline-size; }
  .qtext { color:#fff; font-size:clamp(12.5px, 7cqi, 17px); font-weight:600; line-height:1.4; display:-webkit-box; -webkit-line-clamp:10; -webkit-box-orient:vertical;
    overflow:hidden; text-wrap:pretty; }
  .picfrom { font-size:10.5px; color:var(--label); margin-top:-2px; }
  .qcard::before { content:"\201C"; display:block; height:30px; font-size:56px; line-height:1; color:var(--sky); font-family:Georgia, serif; }
  .tstat { display:grid; grid-template-columns:1fr 1fr; gap:10px; padding-top:4px; margin-top:auto; }
  .tstat b { display:block; font-size:20px; color:var(--navy); line-height:1.15; }
  .tstat span { display:block; font-size:10px; font-weight:700; letter-spacing:0.9px; text-transform:uppercase; color:var(--label); padding-top:2px; }
  .open { font-size:11px; font-weight:700; color:var(--deep); }
  .toppost:hover .open { text-decoration:underline; }
  .ext { font-size:10px; color:var(--blue); }
  a.plink, tbody td a { color:var(--navy); text-decoration:none; text-underline-offset:2px; }
  td.name .alsos { display:block; margin-top:2px; }
  td.name a.also { font-weight:400; color:var(--label); margin:0 12px 0 0; white-space:nowrap; }
  a.plink:hover, tbody td a:hover, a.plink:focus-visible, tbody td a:focus-visible { text-decoration:underline; }
  a.plink:hover, a.plink:focus-visible { text-decoration:underline; }
  tr.golink { cursor:pointer; }

  /* paid media creative: the files themselves, each one opens */
  .crgrid { display:grid; grid-template-columns:repeat(auto-fill,minmax(190px,1fr)); gap:16px; }
  .cr { margin:0; display:flex; flex-direction:column; gap:8px; }
  .crb { padding:0; border:0; background:var(--wash); border-radius:10px; overflow:hidden; cursor:zoom-in; display:block;
    box-shadow:0 1px 2px rgba(0,21,39,0.06); transition:transform .14s, box-shadow .14s; }
  .crb:hover { transform:translateY(-2px); box-shadow:0 8px 20px -10px rgba(0,21,39,0.4); }
  .crb { aspect-ratio:1/1; display:flex; align-items:center; justify-content:center; padding:10px; }
  .crb img { display:block; width:auto; height:auto; max-width:100%; max-height:100%; background:transparent; }
  .crgrid.prints { grid-template-columns:repeat(auto-fill,minmax(min(320px,100%),1fr)); gap:20px; }
  .crgrid.prints .crb { aspect-ratio:4/3; }
  /* a phone-shaped video keeps its own proportions, so the still is as wide as its neighbours */
  .cr.vtall .crb { aspect-ratio:9/16; }
  .crgrid.prints .cr.tall .crb { aspect-ratio:4/3; }
  .cr figcaption { font-size:12.5px; font-weight:700; color:var(--navy); line-height:1.35; }
  .crk { display:block; font-size:10px; font-weight:600; letter-spacing:0.4px; text-transform:none; color:var(--label); }
  .crview { position:fixed; inset:0; z-index:60; background:rgba(0,12,22,0.72); display:flex; align-items:center;
    justify-content:center; padding:32px; }
  .crview[hidden] { display:none; }
  .crbox { position:relative; background:#fff; border-radius:14px; max-width:min(1160px,96vw); width:100%; max-height:100%;
    display:grid; grid-template-columns:minmax(0,1.45fr) minmax(330px,1fr); grid-template-rows:minmax(0,1fr); overflow:hidden;
    box-shadow:0 30px 70px -30px rgba(0,0,0,0.8); }
  .crimg { background:var(--wash); display:flex; align-items:center; justify-content:center; padding:22px; min-height:0; }
  .crimg img { max-width:100%; max-height:calc(100vh - 108px); object-fit:contain; display:block; }
  .crside { padding:20px 26px 24px; display:flex; flex-direction:column; gap:12px; overflow:auto; }
  .crtitle { font-size:21px; font-weight:700; color:var(--navy); line-height:1.2; text-wrap:balance; }

    var printNote = qr + web ? '<div class="cscope below">The ' + int(qr + web) + (qr + web === 1 ? " visit" : " visits") +
      " credited to the print ads here sit in the sources table above as well" +
      (qr ? ": " + int(qr) + " from a scan of an ad's code under Other and Not Recorded" : "") +
      (web ? (qr ? " and " : ": ") + int(web) + " from a magazine's online edition under Referral" : "") +
      ", because Google Analytics does not recognise a print code or a magazine's online edition as a channel of its own.</div>" : "";
    return card("Publications and Articles", done + " of " + list.length + " published",
      tbl('<th>Item</th><th class="r">Date</th><th>Status</th><th class="r">Visits</th><th class="r">Average engagement time</th>', body, "") + gallery + printNote);
  }

  /* The creative viewer: click a file to see it at the size it was made, with what its own record proves. */
  var VIEW = [];
  function viewTile(entry, extraClass) {
    var n = VIEW.push(entry) - 1;
    return '<figure class="cr' + (extraClass ? " " + extraClass : "") + '">' +
      '<button type="button" class="crb" data-view="' + n + '" aria-label="' + esc("Open " + entry.title + (entry.label ? ", " + entry.label : "")) + '">' +
      '<img src="' + esc(entry.image) + '" alt="' + esc(entry.title + (entry.label ? ", " + entry.label : "")) + '"></button>' +
      "<figcaption>" + esc(entry.caption || entry.title) +
      (entry.note ? '<span class="crk">' + esc(entry.note) + "</span>" : "") + "</figcaption></figure>";
  }

  function creativeViewer(root) {
    var dlg = document.getElementById("crview");
    if (!dlg) {
      dlg = document.createElement("div");
      dlg.id = "crview";
      dlg.className = "crview";
      dlg.setAttribute("role", "dialog");
      dlg.setAttribute("aria-modal", "true");
      dlg.setAttribute("aria-labelledby", "crtitle");
      dlg.hidden = true;
      dlg.innerHTML = '<div class="crbox"><button type="button" class="crx" aria-label="Close">\u00D7</button>' +
        '<div class="crimg"><img alt=""></div><div class="crside"><div class="crtitle hdln" id="crtitle"></div><div class="crcards" hidden></div>' +
        '<dl class="crfacts"></dl><div class="crkpi" hidden></div></div></div>';
      document.body.appendChild(dlg);
      dlg.addEventListener("click", function (ev) {
        if (ev.target === dlg || ev.target.closest(".crx")) closeCreative();
        var card = ev.target.closest(".crcards button");
        if (card) {
          dlg.querySelector(".crimg img").src = card.getAttribute("data-src");
          [].forEach.call(dlg.querySelectorAll(".crcards button"), function (b) { b.setAttribute("aria-pressed", String(b === card)); });
        }
      });
      document.addEventListener("keydown", function (ev) { if (ev.key === "Escape") closeCreative(); });
      dlg.addEventListener("keydown", function (ev) {
        if (ev.key === "Tab") {
          var f = [].filter.call(dlg.querySelectorAll("button"), function (b) { return b.offsetParent !== null || b.classList.contains("crx"); });
          var i = f.indexOf(document.activeElement);
          (f[(i + (ev.shiftKey ? -1 : 1) + f.length) % f.length] || f[0]).focus();
          ev.preventDefault();
          return;
        }
        var k = { ArrowDown: 40, ArrowUp: -40, PageDown: 0.9, PageUp: -0.9, End: 1e6, Home: -1e6 }[ev.key];
        if (k === undefined) return;
        var bx = dlg.querySelector(".crbox"), sd = dlg.querySelector(".crside");
        var s = bx.scrollHeight > bx.clientHeight + 1 ? bx : sd;
        s.scrollTop += Math.abs(k) < 1 ? k * s.clientHeight : k;
        ev.preventDefault();
      });
    }
    [].forEach.call(root.querySelectorAll(".crb"), function (b) {
      b.addEventListener("click", function () { openCreative(+b.getAttribute("data-view"), b); });
    });
  }
  var crLast = null;
  function openCreative(n, from) {
    var c = VIEW[n];
    if (!c) return;
    var dlg = document.getElementById("crview");
    crLast = from || null;
    dlg.querySelector(".crimg img").src = c.image;
    dlg.querySelector(".crimg img").alt = c.title;
    dlg.querySelector(".crtitle").textContent = c.title;
    dlg.querySelector(".crfacts").innerHTML = c.facts.map(function (f) {
      return '<div class="fact"><dt>' + esc(f[0]) + "</dt><dd>" + (f[2] ? f[1] : esc(f[1])) + "</dd></div>";
    }).join("");
    /* A carousel opens on all its cards; a card clicked below takes the large frame. */
    var cardsEl = dlg.querySelector(".crcards");
    cardsEl.innerHTML = (c.cards && c.cards.length > 1) ? c.cards.map(function (src, i) {
      return '<button type="button" data-src="' + esc(src) + '" aria-pressed="' + (i === 0) + '" aria-label="Card ' + (i + 1) +
        '"><img src="' + esc(src) + '" alt=""></button>';
    }).join("") : "";
    cardsEl.hidden = !(c.cards && c.cards.length > 1);
    /* What the ad drove, for the months chosen at the top of the page. */
    var kpi = dlg.querySelector(".crkpi");
    if (c.ads && c.ads.length) {
      var several = c.ads.length > 1 || /\bads\b/.test(c.ads[0].name);
      var pair = c.ads.some(function (x) { return /two ads/.test(x.name); });
      kpi.innerHTML = '<div class="crkh">What ' + (several ? "these ads" : "the ad") + " drove, " + esc(label(range)) + "</div>" +
        '<table><thead><tr><th>Ad</th><th class="r">Sessions</th><th class="r">Average engagement time</th>' +
        '<th class="r">Purchases credited</th></tr></thead><tbody>' + c.ads.map(function (x) {
          var f = adFigures(x);
          return '<tr><td>' + esc(x.platform) + '<span class="raw">' + esc(x.row || x.name) + '</span></td><td class="r num">' + int(f.s) +
            '</td><td class="r num">' + etime(f.t, f.s) + '</td><td class="r num">' + int(f.u) + "</td></tr>";
        }).join("") + "</tbody></table>" +
        '<div class="crkn">Google Analytics records sessions and purchases by ad, not by picture, so these are the whole ' +
        "ad's figures, shared by every picture it carried." + (pair ? " Where two ads share a name, the figure is the pair's." : "") + "</div>";
      kpi.hidden = false;
    } else { kpi.innerHTML = ""; kpi.hidden = true; }
    dlg.hidden = false;
    document.body.classList.add("noscroll");
    [].forEach.call(document.querySelectorAll(".wrap"), function (w) { w.inert = true; });  /* Tab stays in the viewer */
    dlg.querySelector(".crbox").scrollTop = 0;
    dlg.querySelector(".crside").scrollTop = 0;
    dlg.querySelector(".crx").focus();
  }
  function closeCreative() {
    var dlg = document.getElementById("crview");
    if (!dlg || dlg.hidden) return;
    dlg.hidden = true;
    document.body.classList.remove("noscroll");
    [].forEach.call(document.querySelectorAll(".wrap"), function (w) { w.inert = false; });
    if (crLast) crLast.focus();
  }

  /* ------------------------------------------------------------------ render */
  var SECTIONS = [["products", "What sold", products], ["sources", "Sources", sources], ["pages", "CWI pages", pages],
    ["paid", "Paid media", paid], ["email", "Email", email],
    ["sms", "Texts", sms], ["twiw", "This Week in Welding", twiw], ["social", "Organic social", social],
    ["publications", "Publications", publications]];

  function renderSection(id) {
    SECTIONS.forEach(function (s) { if (s[0] === id) set(id, s[2]()); });
    var el = document.getElementById(id);
    applyFold(id, el);
    [].forEach.call(el.querySelectorAll("table.sortable th"), function (th) {
      if (!th.textContent.trim()) th.setAttribute("data-nosort", "1");
      if (!th.hasAttribute("data-nosort")) th.setAttribute("tabindex", "0");
    });
    pageTables(el);
    creativeViewer(el);
    var names = {};
    [].forEach.call(el.querySelectorAll(".crb"), function (b) { var k = b.getAttribute("aria-label"); (names[k] = names[k] || []).push(b); });
    Object.keys(names).forEach(function (k) {
      if (names[k].length > 1) names[k].forEach(function (b, i) { b.setAttribute("aria-label", k + ", " + (i + 1) + " of " + names[k].length); });
    });
    /* A table that runs wider than its card says so, with a fade at the edge it scrolls towards. */
    [].forEach.call(el.querySelectorAll(".tw"), fitTable);
  }
  /* A channel section closes under its title; the button says what it does. */
  function applyFold(id, el) {
    var c = FOLD[id] && el.querySelector(".card");
    if (!c) return;
    var hd = c.querySelector(".chd"), body = document.createElement("div");
    body.className = "fbody";
    body.id = id + "-body";
    while (hd.nextSibling) body.appendChild(hd.nextSibling);
    c.appendChild(body);
    var b = document.createElement("button");
    b.type = "button";
    b.className = "fold";
    b.setAttribute("data-fold", id);
    b.setAttribute("aria-controls", body.id);
    hd.appendChild(b);
    showFold(id, !!(openSec[id] || window.__cwiOpenAll));
  }
  function showFold(id, open) {
    var el = document.getElementById(id), b = el && el.querySelector("button.fold"), body = el && el.querySelector(".fbody");
    if (!b || !body) return;
    openSec[id] = open;
    body.hidden = !open;
    b.setAttribute("aria-expanded", String(open));
    b.textContent = open ? "Hide details" : "Show details";
    el.querySelector(".card").classList.toggle("shut", !open);
    if (open) [].forEach.call(body.querySelectorAll(".tw"), fitTable);
  }
  function fitTable(w) {
      var more = function () { w.classList.toggle("end", w.scrollLeft + w.clientWidth >= w.scrollWidth - 4); };
      w.classList.toggle("scrolls", w.scrollWidth > w.clientWidth + 1);
      if (w.scrollWidth > w.clientWidth + 1 && !w.querySelector("a, button, [tabindex]")) {
        var ct = w.closest(".card") && w.closest(".card").querySelector(".ctitle");
        w.setAttribute("role", "region"); w.setAttribute("tabindex", "0");
        w.setAttribute("aria-label", (ct ? ct.textContent : "Table") + " table");
      } else if (w.getAttribute("role") === "region") { w.removeAttribute("role"); w.removeAttribute("tabindex"); w.removeAttribute("aria-label"); }
      more();
      if (!w.__fade) { w.__fade = true; w.addEventListener("scroll", function () { w.classList.toggle("end", w.scrollLeft + w.clientWidth >= w.scrollWidth - 4); }, { passive: true }); }
  }
  window.addEventListener("resize", function () { [].forEach.call(document.querySelectorAll(".tw"), fitTable); }, { passive: true });
  /* A control focused inside a scrolling table is brought fully into view, clear of the pinned first column. */
  document.addEventListener("focusin", function (e) {
    var w = e.target.closest && e.target.closest(".tw");
    if (!w || e.target === w || w.scrollWidth <= w.clientWidth + 1 || !e.target.matches(":focus-visible")) return;
    var cell = e.target.closest("th, td") || e.target, wr = w.getBoundingClientRect(), r = e.target.getBoundingClientRect();
    var pin = cell.parentNode.firstElementChild, pinW = pin !== cell && getComputedStyle(pin).position === "sticky" ? pin.getBoundingClientRect().width : 0;
    /* A control wider than the room beside the pinned column shows its start; any other shows whole. */
    if (r.width > wr.right - wr.left - pinW - 12) w.scrollLeft += r.left - (wr.left + pinW) - 4;
    else if (r.right > wr.right - 4) w.scrollLeft += r.right - wr.right + 8;
    else if (r.left < wr.left + pinW) w.scrollLeft -= wr.left + pinW - r.left + 8;
  });
  function renderAll() {
    VIEW.length = 0;
    renderPeriod();
    renderKpis();
    SECTIONS.forEach(function (s) { renderSection(s[0]); });
    set("nav", SECTIONS.filter(function (s) { return document.getElementById(s[0]).innerHTML; }).map(function (s) {
      return '<a href="#' + s[0] + '">' + s[1] + "</a>";
    }).join(""));
    spy();
  }
  function setRange(from, to) {
    if (MONTHS.indexOf(from) === -1 || MONTHS.indexOf(to) === -1) return;
    if (from > to) { var x = from; from = to; to = x; }
    range = { from: from, to: to };
    try {
      var q = from === DEFAULT.from && to === DEFAULT.to ? location.pathname : location.pathname + "?from=" + from + "&to=" + to;
      history.replaceState(null, "", q + location.hash);
    } catch (e) { /* a local file may refuse; the page still works */ }
    renderAll();
  }

  document.addEventListener("click", function (ev) {
    var th = ev.target.closest("table.sortable th");
    if (th) { sortTable(th); return; }
    var fb = ev.target.closest("button[data-fold]");
    if (fb) { showFold(fb.getAttribute("data-fold"), fb.getAttribute("aria-expanded") !== "true"); spy(); return; }
    var ca = ev.target.closest("button.crall");
    if (ca) {
      var ck = ca.getAttribute("data-cr"), co = ca.getAttribute("aria-expanded") !== "true", more = document.getElementById(ca.getAttribute("aria-controls"));
      crOpen[ck] = co;
      if (more) more.hidden = !co;
      ca.setAttribute("aria-expanded", String(co));
      ca.textContent = crLabel(co, +ca.getAttribute("data-n"), +ca.getAttribute("data-first"));
      return;
    }
    /* A link to a closed section (the channels table, the navigation) opens it before the page moves to it. */
    var sl = ev.target.closest('a[href^="#"]');
    if (sl && FOLD[sl.getAttribute("href").slice(1)]) showFold(sl.getAttribute("href").slice(1), true);
    var pb = ev.target.closest("#period button[data-from]");
    if (pb) {
      var pf = pb.getAttribute("data-from"), pt = pb.getAttribute("data-to");
      setRange(pf, pt);
      var again = document.querySelector('#period button[data-from="' + pf + '"][data-to="' + pt + '"]');
      if (again) again.focus();
      return;
    }
    /* Only the By source / By channel toggles carry data-val; a creative tile's data-view is its viewer index. */
    var vb = ev.target.closest("button[data-view][data-val]");
    if (vb) {
      var vk = vb.getAttribute("data-view"), vv = vb.getAttribute("data-val");
      view[vk] = vv; renderSection(vk);
      var back = document.querySelector("#" + vk + ' button[data-view="' + vk + '"][data-val="' + vv + '"]');
      if (back) back.focus();
      return;
    }
    /* A whole row opens its post; the title inside it is the keyboard and screen reader link. */
    var tr = ev.target.closest("tr.golink");
    if (tr && !ev.target.closest("a, button, th")) window.open(tr.getAttribute("data-href"), "_blank", "noopener");
  });
  document.addEventListener("keydown", function (ev) {
    var th = ev.target.closest && ev.target.closest("table.sortable th");
    if (th && (ev.key === "Enter" || ev.key === " ")) { ev.preventDefault(); sortTable(th); }
  });
  document.addEventListener("change", function (ev) {
    if (ev.target.id === "pfrom" || ev.target.id === "pto") {
      /* The month just picked wins: a From after To moves To up to it, and a To before From moves From. */
      var from = document.getElementById("pfrom").value, to = document.getElementById("pto").value;
      if (from > to) { if (ev.target.id === "pfrom") to = from; else from = to; }
      var which = ev.target.id;
      setRange(from, to);
      var sel = document.getElementById(which);
      if (sel) sel.focus();
    }
  });

  var navLinks = [];
  function spy() {
    navLinks = [].slice.call(document.querySelectorAll(".nav a"));
    var cur = null;
    navLinks.forEach(function (a) {
      var el = document.getElementById(a.getAttribute("href").slice(1));
      if (el && el.getBoundingClientRect().top <= 100) cur = a;
    });
    navLinks.forEach(function (a) { a.classList.toggle("on", a === cur); });
  }
  window.addEventListener("scroll", spy, { passive: true });
  /* A mouse wheel over the navigation scrolls the bar sideways when the links run past its edge. */
  (function () {
    var navEl = document.getElementById("nav");
    navEl.addEventListener("focusin", function (e) {
      if (e.target.closest("a")) e.target.scrollIntoView({ block: "nearest", inline: "nearest" });
    });
    navEl.addEventListener("wheel", function (e) {
      if (navEl.scrollWidth > navEl.clientWidth + 1 && Math.abs(e.deltaY) > Math.abs(e.deltaX)) { navEl.scrollLeft += e.deltaY; e.preventDefault(); }
    }, { passive: false });
  })();
  /* The period chip in the navigation appears once the period bar itself has scrolled away. */
  (function () {
    var bar = document.getElementById("navbar"), per = document.getElementById("period");
    if (!bar || !per) return;
    /* the period bar sits above the navigation, so it has gone once it slides under the pinned bar */
    function past() { bar.classList.toggle("past", per.getBoundingClientRect().bottom < bar.offsetHeight); }
    window.addEventListener("scroll", past, { passive: true });
    past();
  })();

  set("title", esc(D.meta.campaign));
  set("through", "DATA THROUGH " + longDate(D.meta.dataThrough));
  renderAll();
  if (FOLD[location.hash.slice(1)]) {
    showFold(location.hash.slice(1), true);
    document.getElementById(location.hash.slice(1)).scrollIntoView();
  }
  window.__cwiSetRange = setRange;  /* for the render gate */
})();
</script>
</body></html>
