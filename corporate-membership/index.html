<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8">
<title>Campaign Performance | American Welding Society</title>
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
  /* Campaign dashboard template v2. The shell contains no numbers: every figure comes
     from campaign-data.js. Sections render only when their data exists, and the nav is
     built from what rendered, so a campaign with no paid media reads as complete. */
  :root {
    --navy:#001527; --deep:#003767; --blue:#0074E2; --orange:#F56A00;
    --ink:#2E3132; --mid:#63696B; --faint:#9AA0A3;
    --line:#E2E5E7; --hair:#EDEFF0; --wash:#F7F8F9; --page:#EBEEF0;
    --up:#1B7F47; --down:#B93A26; --hold:#9A6B00;
  }
  * { box-sizing:border-box; }
  html { scroll-behavior:smooth; }
  body { margin:0; background:var(--page); color:var(--ink);
    font-family:system-ui,-apple-system,"Segoe UI","Helvetica Neue",Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased; font-size:13px; line-height:1.45; }
  .num { font-variant-numeric:tabular-nums; font-feature-settings:"tnum" 1; }
  .hdln { font-family:"Helvetica Neue Condensed","HelveticaNeue-CondensedBold","Arial Narrow","Helvetica Neue",Arial,sans-serif; font-stretch:condensed; }
  a { color:var(--blue); text-decoration:none; }
  a:hover { color:var(--deep); text-decoration:underline; }

  .wrap { min-height:100vh; padding:28px 24px 72px; display:flex; justify-content:center; }
  .col { width:1180px; max-width:100%; display:flex; flex-direction:column; gap:18px; }

  /* masthead */
  .shell { border-radius:10px; overflow:hidden; box-shadow:0 1px 3px rgba(0,21,39,0.10); }
  .mast { background:var(--navy); padding:26px 28px 24px; display:flex; align-items:flex-end;
    justify-content:space-between; gap:28px; border-top:3px solid var(--orange); }
  .org { font-size:10px; font-weight:700; text-transform:uppercase; letter-spacing:2.6px; color:#8FA0AE; }
  .ttl { font-size:34px; font-weight:700; text-transform:uppercase; letter-spacing:0.2px; color:#fff; line-height:1.02; margin-top:7px; }
  .through { font-size:10.5px; font-weight:700; text-transform:uppercase; letter-spacing:1.4px; color:#CBD4DA;
    white-space:nowrap; border:1px solid rgba(255,255,255,0.22); border-radius:3px; padding:6px 11px; }
  .links { background:#fff; border-top:1px solid var(--line); padding:12px 28px; display:flex;
    gap:14px; align-items:center; font-size:12px; font-weight:600; flex-wrap:wrap; }
  .links a { white-space:nowrap; }
  .links .sep { color:#C6CBCE; font-weight:400; }

  .navbar { position:sticky; top:0; z-index:30; background:rgba(255,255,255,0.97);
    border:1px solid var(--line); border-radius:8px; box-shadow:0 1px 2px rgba(0,21,39,0.06); }
  .nav { display:flex; padding:0 20px; flex-wrap:wrap; gap:0 24px; }
  .nav a { padding:13px 0 10px; font-size:11px; text-transform:uppercase; letter-spacing:1.3px;
    font-weight:700; color:var(--mid); border-bottom:2px solid transparent; white-space:nowrap; }
  .nav a:hover { color:var(--navy); text-decoration:none; border-bottom-color:#C6CBCE; }
  .nav a.on { color:var(--navy); border-bottom-color:var(--orange); }
  #traffic, #attribution, #tiers, #paid, #email, #social, #traditional, #video { scroll-margin-top:64px; }

  /* cards */
  .card { background:#fff; border:1px solid var(--line); border-radius:8px; padding:0 20px 20px;
    display:flex; flex-direction:column; gap:16px; box-shadow:0 1px 2px rgba(0,21,39,0.04); }
  .chd { display:flex; justify-content:space-between; align-items:baseline; gap:14px; flex-wrap:wrap;
    margin:0 -20px; padding:15px 20px 13px; border-bottom:1px solid var(--hair); }
  .ctitle { font-size:15px; font-weight:700; text-transform:uppercase; letter-spacing:0.9px; color:var(--navy);
    white-space:nowrap; flex:0 0 auto; }
  .cscope { font-size:11.5px; color:var(--mid); line-height:1.55; max-width:78ch; text-wrap:pretty; }
  .cscope.below { max-width:none; margin-bottom:-2px; }
  .sub { font-size:9.5px; font-weight:700; text-transform:uppercase; letter-spacing:1.3px; color:var(--faint);
    padding-top:4px; display:flex; align-items:center; gap:9px; }
  .sub::after { content:""; flex:1; height:1px; background:var(--hair); }
  .herolabel { padding-top:2px; padding-bottom:2px; font-size:11px; color:var(--mid); margin-bottom:-12px; }
  .strip .si.head { background:var(--navy); border-left:none; border-radius:7px 0 0 7px; }
  .strip .si.head .sil { color:#fff; }

  /* kpi tiles */
  .kpis { display:grid; grid-template-columns:repeat(auto-fit,minmax(178px,1fr)); gap:14px; }
  .kpi { background:#fff; border:1px solid var(--line); border-radius:8px;
    padding:16px 18px 18px; display:flex; flex-direction:column; gap:5px; min-height:128px;
    box-shadow:0 1px 2px rgba(0,21,39,0.05); }
  .kch { font-size:9px; letter-spacing:1.3px; text-transform:uppercase; color:var(--faint); font-weight:700; }
  .klab { font-size:11.5px; color:var(--mid); font-weight:600; line-height:1.35; }
  .ksub { font-size:10.5px; color:var(--faint); line-height:1.4; }
  .kval { font-size:36px; font-weight:700; color:var(--navy); line-height:1; margin-top:auto;
    padding-top:10px; letter-spacing:-0.5px; }
  .card.strip { flex-direction:row; flex-wrap:wrap; gap:0; align-items:stretch; padding:0; margin-top:-6px; }
  .strip .si { padding:12px 22px; display:flex; align-items:baseline; gap:8px; flex:0 1 auto;
    border-left:1px solid var(--hair); white-space:nowrap; }
  .strip .si:first-child { border-left:none; }
  .strip .sil { font-size:10px; font-weight:700; text-transform:uppercase; letter-spacing:1.1px; color:var(--faint); }
  .strip .siv { font-size:17px; font-weight:700; color:var(--navy); }
  .strip .sis { font-size:10.5px; color:var(--mid); }

  /* tables */
  .tw { width:100%; overflow-x:auto; -webkit-overflow-scrolling:touch; }
  table { border-collapse:collapse; width:100%; font-size:12.5px; }
  table.sortable th { cursor:pointer; user-select:none; }
  table.sortable th::after { content:"\2195"; margin-left:5px; color:transparent; font-size:9px; }
  table.sortable th:hover { color:var(--navy); }
  table.sortable th:hover::after { color:#C6CBCE; }
  table.sortable th.sorted { color:var(--navy); }
  table.sortable th.sorted::after { color:var(--blue); }
  table.sortable th.sorted[data-dir="asc"]::after { content:"\2191"; }
  table.sortable th.sorted[data-dir="desc"]::after { content:"\2193"; }
  th { text-align:left; font-size:9.5px; letter-spacing:0.9px; text-transform:uppercase; color:var(--mid);
    font-weight:700; padding:0 12px 8px 0; border-bottom:1px solid var(--line); white-space:nowrap; }
  td { padding:10px 12px 10px 0; border-bottom:1px solid var(--hair); vertical-align:middle; white-space:nowrap; }
  tbody tr:last-child td { border-bottom:none; }
  tbody tr:hover td { background:#F9FAFB; }
  td.r, th.r { text-align:right; padding-right:0; }
  th.r + th, td.r + td { padding-left:16px; }
  tr.tot td { font-weight:700; color:var(--navy); border-top:1.5px solid var(--navy); border-bottom:none;
    background:#F5F7F8; padding-top:11px; padding-bottom:11px; }
  tr.tot:hover td { background:#F1F4F6; }
  tr.subt td { font-weight:700; color:var(--navy); border-top:1px solid #C6CBCE; }
  tr.grp td, tr.grp:hover td { background:var(--navy); color:#fff; font-size:9px; font-weight:700;
    text-transform:uppercase; letter-spacing:1.4px; padding:7px 12px 7px 0; text-indent:12px; }
  .name { font-weight:600; color:var(--navy); }
  .dim { color:var(--mid); font-weight:400; }
  .up { color:var(--up); font-weight:700; }
  .down { color:var(--down); font-weight:700; }
  .note { font-size:11px; line-height:1.55; color:var(--mid); font-weight:400; text-wrap:pretty; }
  .callout { display:block; background:var(--wash); border:1px solid var(--hair); border-radius:6px; padding:11px 13px; }
  .pill { display:inline-block; font-size:9px; font-weight:700; letter-spacing:0.9px; text-transform:uppercase;
    border-radius:3px; padding:3px 8px; }
  .ok { background:#E7F3EC; color:var(--up); }
  .warn { background:#F6EFDF; color:var(--hold); }
  .flat { background:#EFF1F2; color:var(--mid); }
  .chip { font-size:8.5px; font-weight:700; letter-spacing:0.8px; background:#E7F1FC; color:var(--blue); border-radius:2px; padding:2px 5px; vertical-align:1px; }

  /* share bars */
  .mshare { display:flex; flex-direction:column; gap:7px; }
  .msrow { display:flex; justify-content:space-between; font-size:11.5px; color:var(--mid); }
  .msrow b { color:var(--navy); }
  .msbar { height:12px; background:var(--hair); border-radius:3px; overflow:hidden; }
  .msbar i { display:block; height:100%; background:var(--blue); }
  .sbar { display:block; width:100%; min-width:96px; height:6px; background:#EFF1F2; border-radius:3px; }
  .sbar i { display:block; height:100%; background:#8DB9E9; border-radius:3px; }

  /* galleries (organic social, paid creatives, traditional artwork, video) */
  .gal { display:grid; grid-template-columns:repeat(auto-fill,minmax(196px,1fr)); gap:14px; }
  .gal.ads { grid-template-columns:repeat(auto-fill,minmax(268px,1fr)); }
  .post { border:1px solid var(--line); border-radius:7px; overflow:hidden; display:flex; flex-direction:column;
    background:#fff; transition:border-color .15s, box-shadow .15s; }
  .post:hover { border-color:#C6CBCE; box-shadow:0 2px 8px rgba(0,21,39,0.07); }
  .thumb { position:relative; aspect-ratio:1/1; background:#F2F3F4 repeating-linear-gradient(135deg,#E9EBEC 0 6px,#F4F5F6 6px 12px); display:flex; align-items:center; justify-content:center; }
  .thumb.wide { aspect-ratio:16/10; }
  .thumb img { width:100%; height:100%; object-fit:contain; display:block; background:#FFFFFF; }
  .quote { padding:16px; font-size:12px; line-height:1.55; color:var(--mid); align-self:center; text-wrap:pretty; }
  .play { position:absolute; left:50%; top:50%; transform:translate(-50%,-50%); width:38px; height:38px; border-radius:50%; background:rgba(0,21,39,0.72); color:#fff; display:flex; align-items:center; justify-content:center; font-size:13px; padding-left:3px; }
  .dur { position:absolute; right:7px; bottom:7px; background:rgba(0,21,39,0.80); color:#fff; font-size:9.5px; font-weight:700; padding:2px 6px; border-radius:3px; }
  .pmeta { padding:11px 12px 13px; display:flex; flex-direction:column; gap:8px; flex:1; }
  .pplat { display:flex; justify-content:space-between; align-items:baseline; gap:4px 8px; flex-wrap:wrap; font-size:9px; font-weight:700; text-transform:uppercase; letter-spacing:1.1px; color:var(--faint); }
  .pplat > span, .pplat > a { white-space:nowrap; }
  .pcap { font-size:11.5px; line-height:1.5; color:var(--ink); display:-webkit-box; -webkit-line-clamp:4; -webkit-box-orient:vertical; overflow:hidden; text-wrap:pretty; }
  .adname { font-size:12.5px; font-weight:700; color:var(--navy); line-height:1.35; }
  .pfig { display:grid; grid-template-columns:repeat(auto-fit,minmax(74px,1fr)); gap:10px 14px;
    margin-top:auto; padding-top:10px; border-top:1px solid var(--hair); }
  .pf { min-width:0; }
  .pf .pfl { font-size:8.5px; font-weight:700; text-transform:uppercase; letter-spacing:1px; color:var(--faint); line-height:1.3; }
  .pf .pfv { font-size:16px; font-weight:700; color:var(--navy); }
  .pview { font-size:9px; font-weight:700; letter-spacing:0.9px; text-transform:uppercase; }
  .galsum { display:flex; flex-wrap:wrap; gap:0; border:1px solid var(--hair); border-radius:7px; background:var(--wash); }
  .gs { padding:11px 20px; border-left:1px solid var(--hair); flex:0 1 auto; }
  .gs:first-child { border-left:none; }
  .gs .l { font-size:9.5px; font-weight:700; text-transform:uppercase; letter-spacing:1.1px; color:var(--faint); }
  .gs .v { font-size:21px; font-weight:700; color:var(--navy); padding-top:3px; line-height:1.15; white-space:nowrap; }
  .msgs { font-size:11px; }
  .msgs th { font-size:8.5px; padding-bottom:6px; }
  .msgs td { padding:5px 10px 5px 0; }
  .enote { font-size:11.5px; line-height:1.6; color:var(--mid); border-top:1px solid var(--hair); padding-top:13px; text-wrap:pretty; }

  @media (max-width:960px) {
    .kpis { grid-template-columns:repeat(2,1fr); }
    .ttl { font-size:28px; }
  }
  @media (max-width:520px) {
    .wrap { padding:12px 10px 44px; }
    .kpis { grid-template-columns:1fr; }
    .mast { flex-direction:column; align-items:flex-start; gap:12px; padding:20px 18px 18px; }
    .card { padding:0 14px 16px; }
    .chd { margin:0 -14px; padding:13px 14px 11px; }
    .ctitle { white-space:normal; }
    .links { padding:11px 14px; }
    .nav { padding:0 14px; }
    .strip .si { border-left:none; padding:9px 14px; }
    .gal, .gal.ads { grid-template-columns:1fr; }
  }
</style>
</head><body>
<div class="wrap"><div class="col">
  <div class="shell">
    <div class="mast">
      <div>
        <div class="org">American Welding Society</div>
        <div class="ttl hdln" id="title"></div>
      </div>
      <div class="through num" id="through"></div>
    </div>
    <div class="links" id="hlinks"></div>
  </div>
  <div class="navbar" id="navbar"><div class="nav" id="nav"></div></div>

  <div class="kpis" id="kpis"></div>
  <div id="attribution"></div>
  <div id="tiers"></div>
  <div id="traffic"></div>
  <div id="paid"></div>
  <div id="email"></div>
  <div id="social"></div>
  <div id="traditional"></div>
  <div id="video"></div>
</div></div>

<script>
(function () {
  "use strict";
  var DASH = "—";
  var NAVY = "#001527", BLUE = "#0074E2", ORANGE = "#F56A00", GREY = "#B6BABC",
      LIGHT = "#EDEEEF", DIM = "#6E7274";

  function has(v) { return v !== undefined && v !== null; }
  function asset(u) {
    var id = (window.__assetMap || {})[u];
    return (id && window.__resources && window.__resources[id]) || u;
  }
  function esc(s) { return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;"); }
  function int(v) { return has(v) ? Math.round(v).toLocaleString("en-US") : DASH; }
  function money(v) { return has(v) ? "$" + v.toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 }) : DASH; }
  function money0(v) { return has(v) ? "$" + Math.round(v).toLocaleString("en-US") : DASH; }
  function pct(v, d) { return has(v) ? v.toFixed(d === undefined ? 1 : d) + "%" : DASH; }
  function ratio(a, b, d) { return (has(a) && has(b) && b) ? pct(100 * a / b, d) : DASH; }
  function per(spend, n) { return (has(spend) && has(n) && n) ? money(spend / n) : DASH; }
  function dur(seconds, sessions) {
    if (!has(seconds) || !sessions) return DASH;
    var s = Math.round(seconds / sessions);
    return s >= 60 ? Math.floor(s / 60) + "m " + String(s % 60).padStart(2, "0") + "s" : s + "s";
  }
  function fmtv(v, f) {
    return f === "money" ? money(v) : f === "money0" ? money0(v)
      : f === "pct" ? pct(v) : f === "pct2" ? pct(v, 2) : int(v);
  }
  var MO = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  function dayShort(iso) {
    if (!has(iso)) return DASH;
    var p = String(iso).split("-");
    return p.length >= 3 ? MO[+p[1] - 1] + " " + (+p[2]) : esc(iso);
  }
  function longDate(iso) {
    var p = String(iso).split("-");
    return MO[+p[1] - 1].toUpperCase() + " " + (+p[2]) + ", " + p[0];
  }
  /* Percentage change. A missing or zero base renders a dash: never an invented or
     infinite change. */
  function chg(now, was) {
    if (!has(now) || !has(was) || !was) return DASH;
    var d = (now - was) / was * 100;
    var cls = Math.abs(d) < 0.05 ? "" : d > 0 ? "up" : "down";
    return '<span class="' + cls + ' num">' + (d > 0 ? "+" : d < 0 ? "−" : "") + Math.abs(d).toFixed(1) + "%</span>";
  }
  function set(id, html) { document.getElementById(id).innerHTML = html; }
  function card(title, scope, body) {
    return '<div class="card"><div class="chd"><div class="ctitle hdln">' + esc(title) +
      '</div><div class="cscope">' + scope + "</div></div>" + body + "</div>";
  }
  function tbl(head, rows, foot, sortable) {
    return '<div class="tw"><table' + (sortable ? ' class="sortable"' : "") + '><thead><tr>' + head +
      "</tr></thead><tbody>" + rows + (foot || "") + "</tbody></table></div>";
  }
  /* Click a column heading to sort. Totals rows stay pinned at the bottom; tables with
     group headers are never sortable because sorting would scramble the groups. */
  function cellVal(td) {
    var t = td.textContent.replace(/[$,%\s]/g, "");
    if (t === "" || t === "\u2014") return -Infinity;
    var n = parseFloat(t);
    return isNaN(n) ? td.textContent.trim().toLowerCase() : n;
  }
  document.addEventListener("click", function (ev) {
    var th = ev.target.closest("table.sortable th");
    if (!th) return;
    var table = th.closest("table"), body = table.tBodies[0];
    var idx = [].indexOf.call(th.parentNode.children, th);
    var dir = th.getAttribute("data-dir") === "desc" ? 1 : -1;
    [].forEach.call(th.parentNode.children, function (h) { h.removeAttribute("data-dir"); h.classList.remove("sorted"); });
    th.setAttribute("data-dir", dir === 1 ? "asc" : "desc");
    th.classList.add("sorted");
    var rows = [].slice.call(body.rows);
    var pinned = rows.filter(function (r) { return r.classList.contains("tot"); });
    var live = rows.filter(function (r) { return !r.classList.contains("tot"); });
    live.sort(function (a, b) {
      var va = cellVal(a.cells[idx]), vb = cellVal(b.cells[idx]);
      return va < vb ? dir : va > vb ? -dir : 0;
    });
    live.concat(pinned).forEach(function (r) { body.appendChild(r); });
  });
  /* Monday vocabulary never reaches the page. */
  function state(v) {
    var t = String(v || "").toLowerCase();
    if (/done|deliver|publish|sent|live|complete/.test(t)) return "Done";
    if (/progress|stuck|review|draft|schedul|working/.test(t)) return "In progress";
    return "Not started";
  }
  function pillFor(st) {
    return '<span class="pill ' + (st === "Done" ? "ok" : st === "In progress" ? "warn" : "flat") + '">' + st + "</span>";
  }

  function render() {
    var D = window.CAMPAIGN_DATA;
    if (!D) return;
    var F = D.flags || {};
    var isPurchase = F.outcomeType === "purchase";
    var outLabel = (D.outcome && D.outcome.label) || (isPurchase ? "Purchases" : "Submissions");
    var hasYo = !!F.hasPriorYear && !!D.prior;

    /* masthead */
    set("title", esc(D.meta.campaign));
    set("through", "DATA THROUGH " + longDate(D.meta.dataThrough));
    var links = [];
    if (D.meta.landingPage) links.push('<a href="' + esc(D.meta.landingPage) + '" target="_blank" rel="noopener">' + esc(D.meta.landingPath || "Landing page") + "</a>");
    if (D.meta.formUrl) links.push('<a href="' + esc(D.meta.formUrl) + '" target="_blank" rel="noopener">Form</a>');
    if (D.meta.mondayBoard) links.push('<a href="' + esc(D.meta.mondayBoard) + '" target="_blank" rel="noopener">Monday board</a>');
    set("hlinks", links.join('<span class="sep">|</span>'));

    /* 1. summary tiles. The PRIMARY row is marketing and its impact, always; overall
       figures such as the all-in outcome and total sessions live in the secondary row
       below it. Owner direction, given more than once, 27-28 August 2026. */
    /* The tiles in the hero row are one class of figure. When they share a channel the
       row carries that name once, instead of stamping the same word on every tile; a
       tile from a different channel still says so. */
    var tileCount = {}, rowLabel = "";
    (D.summary || []).forEach(function (t) { tileCount[t.channel] = (tileCount[t.channel] || 0) + 1; });
    Object.keys(tileCount).forEach(function (k) { if (!rowLabel || tileCount[k] > tileCount[rowLabel]) rowLabel = k; });
    if ((tileCount[rowLabel] || 0) < 2) rowLabel = "";
    function tile(t) {
      return '<div class="kpi">' +
        (t.channel && t.channel !== rowLabel ? '<div class="kch">' + esc(t.channel) + "</div>" : "") +
        '<div class="klab">' + esc(t.label) + '</div><div class="kval num">' + fmtv(t.value, t.fmt) + "</div>" +
        (t.sub ? '<div class="ksub">' + esc(t.sub) + "</div>" : "") + "</div>";
    }
    set("kpis", (D.summary || []).map(tile).join(""));
    var kEl0 = document.getElementById("kpis");
    var oldLabel = document.getElementById("herolabel");
    if (oldLabel) oldLabel.remove();
    if (rowLabel) {
      var hl = document.createElement("div");
      hl.className = "sub hdln herolabel"; hl.id = "herolabel"; hl.textContent = rowLabel;
      kEl0.parentNode.insertBefore(hl, kEl0);
    }
    /* The overall figures read as one slim context strip under the hero row, so the
       page opens on marketing's story without a second wall of boxes. */
    var sec = D.summarySecondary || [];
    var kEl = document.getElementById("kpis");
    var old = document.getElementById("kpis2");
    if (old) old.remove();
    if (sec.length) {
      var div = document.createElement("div");
      div.className = "card strip"; div.id = "kpis2";
      div.innerHTML = (D.summarySecondaryLabel ? '<span class="si head"><span class="sil">' + esc(D.summarySecondaryLabel) + "</span></span>" : "") +
        sec.map(function (t) {

        return '<div class="post">' + thumb + '<div class="pmeta">' +
          '<div class="pplat"><span>' + (p.url ? '<a href="' + esc(p.url) + '" target="_blank" rel="noopener">' + esc(p.platform) + "</a>" : esc(p.platform)) + '</span><span class="num">' + (p.scheduled ? "SCHEDULED" : dayShort(p.date)) + "</span>" +
          (has(p.url) ? '<a class="pview" href="' + esc(p.url) + '" target="_blank" rel="noopener">View</a>' : "") + "</div>" +
          (capShown ? '<div class="pcap">' + esc(p.caption) + "</div>" : "") + figs + "</div></div>";
      }
      var body = '<div class="galsum">' +
        '<div class="gs"><div class="l">Posts published</div><div class="v num">' + pub.length + (posts.length > pub.length ? " of " + posts.length : "") + "</div></div>" +
        '<div class="gs"><div class="l">Impressions and views</div><div class="v num">' + int(seen) +
          (measured.length < pub.length && seen !== null ? ' <span class="note">first ' + measured.length + ' posts</span>' : "") + "</div></div>" +
        '<div class="gs"><div class="l">Engagements</div><div class="v num">' + int(eng) + "</div></div>" +
        '<div class="gs"><div class="l">Engagement rate</div><div class="v num">' + ratio(eng, seen, 2) + "</div></div></div>" +
        '<div class="gal">' + posts.map(tile).join("") + "</div>";
      set("social", card("Organic social", "", body));
    })();

    /* 9. traditional media */
    (function () {
      var d = (D.traditional || []).slice().sort(function (a, b) { return String(a.due) < String(b.due) ? -1 : 1; });
      if (!d.length) { set("traditional", ""); return; }
      var done = d.filter(function (r) { return state(r.status) === "Done"; }).length;
      var art = d.filter(function (r) { return has(r.image); });
      var artBlock = art.length ? '<div class="sub hdln">What ran</div><div class="gal ads">' +
        art.map(function (r) {
          return '<div class="post"><div class="thumb wide"><img src="' + esc(asset(r.image)) + '" alt="" loading="lazy"></div><div class="pmeta">' +
            '<div class="pplat"><span>' + esc(r.channel).toUpperCase() + "</span><span>" + esc(r.placement || "") + "</span></div>" +
            '<div class="adname">' + esc(r.headline || r.item) + "</div>" +
            '<div class="pfig">' +
            "</div></div></div>";
        }).join("") + "</div>" : "";
      var hasMeasure = d.some(function (r) { return has(r.sessions); });
      /* Terminus short-link clicks are the print channel's own delivery figure and must
         reach the table, not only an artwork card that may not exist. */
      var hasClicks = d.some(function (r) { return has(r.clicks); });
      /* Publisher-reported delivery for placements the publisher measures: the
         figures come from the publisher's own results, relayed on the campaign
         board, and sit beside the GA4 columns so both sides of the journey show. */
      var hasPub = d.some(function (r) { return has(r.pubClicks); });
      var rows = d.map(function (r) {
        var st = state(r.status);
        return '<tr><td class="dim">' + esc(r.channel) + '</td><td class="name">' + esc(r.item) + "</td>" +
          '<td class="r num">' + dayShort(r.due) + "</td><td>" + pillFor(st) + "</td>" +
          (hasPub ? '<td class="r num">' + int(r.pubClicks) + "</td>" : "") +
          (hasClicks ? '<td class="r num">' + int(r.clicks) + "</td>" : "") +
          (hasMeasure ? '<td class="r num">' + int(r.sessions) + '</td><td class="r num">' + dur(r.seconds, r.sessions) + "</td>" : "") +
          "</tr>";
      }).join("");
      set("traditional", card("Traditional media", done + " of " + d.length + " published",
        artBlock + tbl('<th>Channel</th><th>Item</th><th class="r">Date</th><th>Status</th>' +
          (hasPub ? '<th class="r">Publisher clicks</th>' : "") +
          (hasClicks ? '<th class="r">Short link clicks</th>' : "") +
          (hasMeasure ? '<th class="r">Sessions</th><th class="r">Average engagement time</th>' : ""), rows, "")));
    })();

    /* 10. video assets */
    (function () {
      var V = D.video, assets = (V && V.assets) || [];
      if (!assets.length) { set("video", ""); return; }
      /* Shorts and long form count views on different bases and are never totalled
         together. */
      var long = assets.filter(function (a) { return a.kind !== "short"; });
      var shorts = assets.filter(function (a) { return a.kind === "short"; });
      function sumViews(list) { return list.reduce(function (a, x) { return a + (x.views || 0); }, 0); }
      var body = '<div class="galsum">' +
        '<div class="gs"><div class="l">Assets live</div><div class="v num">' + assets.length + "</div></div>" +
        (long.length ? '<div class="gs"><div class="l">Long form views</div><div class="v num">' + int(sumViews(long)) + ' <span class="note">across ' + long.length + "</span></div></div>" : "") +
        (shorts.length ? '<div class="gs"><div class="l">Short views</div><div class="v num">' + int(sumViews(shorts)) + ' <span class="note">across ' + shorts.length + "</span></div></div>" : "") +
        "</div>" +
        '<div class="gal">' + assets.map(function (a) {
          return '<div class="post"><div class="thumb"><div class="play">&#9654;</div>' +
            (a.duration ? '<div class="dur num">' + esc(a.duration) + "</div>" : "") + "</div>" +
            '<div class="pmeta"><div class="pplat"><span>' + (a.kind === "short" ? "SHORT" : "LONG FORM") +
            (a.year ? " &middot; " + a.year : "") + "</span>" +
            (has(a.url) ? '<a class="pview" href="' + esc(a.url) + '" target="_blank" rel="noopener">Watch</a>' : "") + "</div>" +
            '<div class="pcap">' + esc(a.title) + "</div>" +
            '<div class="pfig"><div class="pf"><div class="pfl">Lifetime views</div><div class="pfv num">' + int(a.views) + "</div></div></div>" +
            "</div></div>";
        }).join("") + "</div>";
      set("video", card("Video assets", "Views are lifetime totals.", body));
    })();

    /* nav, from what rendered */
    var secs = [];
    [["attribution", "Attribution"], ["tiers", "Membership types"], ["traffic", "Traffic"], ["paid", "Paid media"], ["email", "Email"],
     ["social", "Organic social"], ["traditional", "Traditional media"], ["video", "Video"]]
      .forEach(function (s) {
        if (document.getElementById(s[0]).innerHTML) secs.push('<a href="#' + s[0] + '">' + s[1] + "</a>");
      });
    set("nav", secs.join(""));
    var navbar = document.getElementById("navbar");
    if (navbar) navbar.style.display = secs.length ? "" : "none";
    /* Highlight the section the reader is in. Purely an orientation aid: it adds no
       figure and no date to the page. */
    var navLinks = [].slice.call(document.querySelectorAll(".nav a"));
    function spy() {
      var cur = null;
      navLinks.forEach(function (a) {
        var el = document.getElementById(a.getAttribute("href").slice(1));
        if (el && el.getBoundingClientRect().top <= 96) cur = a;
      });
      navLinks.forEach(function (a) { a.classList.toggle("on", a === cur); });
    }
    window.addEventListener("scroll", function () { window.requestAnimationFrame(spy); }, { passive: true });
    spy();
  }

  window.__renderCampaign = render;
})();
</script>
<script src="corporate-membership-data.js"></script>
<script>window.__renderCampaign();</script>


</body></html>
